   LIEBEZEIT — pseudo-3D road engine prototype
   Cabinet 3, lagunaseca70.com
   Placeholder click track at 85bpm. Real audio drops in later.
   ============================================================ */

/* ---------- musical constants ---------------------------------- */
const BPM        = 85;
const BEAT       = 60 / BPM;        // 0.705882 s
const BAR        = BEAT * 4;        // 2.823529 s
const EIGHTH     = BEAT / 2;        // 0.352941 s
/* The working grid is the SIXTEENTH: 176.5 ms, 16 per bar. This is the
   pulse Mike counts as "8 beats per bar" doubled. Everything visual
   lands on it. */
const TICK       = BEAT / 4;        // 0.176471 s
const TICKS_BAR  = 16;
const TOTAL_BARS = 96;              // bar 97 = end
const SONG_LEN   = TOTAL_BARS * BAR; // 271.06 s = 4:31

/* Measured off the master: kick-band comb locks at 46 ms into the file,
   and the file is 271.073 s against 96 bars at 271.059 s. Nudge by ear. */

/* ---------- road constants ------------------------------------- */
const SEGLEN       = 200;
const SEGS_PER_BAR = 196;           // nominal ground covered in one bar
const ROAD_W       = 2000;
const RUMBLE_LEN   = 5;          // band length: 3 strobed at about 7Hz, 5 is about 4Hz
const FINISH_BAR   = 93;         // the line lands on this downbeat
const FINISH_T     = (FINISH_BAR-1) * BAR;
const FINISH_ROWS  = 9;          // how many segments deep the chequered band is
const DASH_LEN     = 6;          // lane paint: on for this many, off for this many
/* How much darker the dark band is than the light one, per surface. The
   palettes carry a second colour for each, but the two are only about four
   per cent apart, which at 224 pixels wide is nothing: the road read as one
   flat grey and the game felt slower than it was. These knock the dark band
   down by a proper margin on top of that. Length is what keeps it
   comfortable, not weakness: RUMBLE_LEN of 5 puts the flicker near 4Hz where
   3 put it near 7, which is the range that makes people feel ill.

   Old note, kept because it is still true: the tarmac banding is what
   carries speed and depth, and taking it out
   cost more than it saved. The comfort now comes from LENGTH instead, which
   halves the flicker rate without touching the contrast, and from the lane
   paint running on its own count rather than switching with the bands. */
const BAND_GROUND  = 0.10;
const BAND_ROAD    = 0.16;
const DRAW_DIST    = 240;
const CAM_HEIGHT   = 820;           // lower camera reads faster
const FOV          = 108;
const CAM_DEPTH    = 1 / Math.tan((FOV / 2) * Math.PI / 180);
const PLAYER_Z     = CAM_HEIGHT * CAM_DEPTH;
const BASE_SPEED   = SEGS_PER_BAR * SEGLEN / BAR;   // 7933 units/s
const THROTTLE_MIN = 0.58;
const THROTTLE_MAX = 1.26;
/* No servo. Speed is the player's, sections arrive when the music says so,
   and the road is composed but experienced at your own pace. */
/* Clean driving should bank time but not snowball, so the clock is capped
   the way an OutRun checkpoint would cap it. */
const TIME_CAP     = 50;
/* ---- drift ------------------------------------------------------
   The car now has a yaw angle and a lateral velocity, and the gap
   between where it points and where it is going IS the slide.
   No handbrake: traction lets go on its own when you ask too much of
   it, which is what makes committing to a corner a decision. */
/* The car has a real heading relative to the road, and its velocity is a
   real vector. Lateral movement comes only from the gap between the two.
   The corner enters as the road tangent rotating underneath you, which is
   what actually happens, rather than as a sideways shove.

   The previous version used one number both to decide whether the tyres
   let go AND to set lateral velocity, with the corner folded into it. The
   road was injecting sideways motion, steering was fighting it, and the
   old centrifugal term was stacked on top. That is why steering vanished. */
/* Steering is direct. The car goes where you point it and the corner
   pushes you wide. That is the whole handling model, and it is the one
   that worked. Every attempt to layer a slide on top of a rear-view
   position model made it worse, so it is gone. */
const STEER_RATE   = 2.6;
const CENTRIFUGAL  = 0.0000265;

/* ---- the chain ladder -------------------------------------------

const CHAIN_CAP   = CHAIN_SCALE.length - 1;

/* The chain reads as heat: pale yellow at the start, through amber and
   orange, into a deep red once you are a long way in. Used on the score pop
   above the car and on the rungs under the score, so the two are obviously
   the same number. */
const CHAIN_HEAT = ["#fff8d4","#ffec9a","#ffd45c","#ffb033","#ff8a24",
                    "#f4611b","#e5400f","#cf2a0c","#b81d09","#a01406"];
function chainColour(n){
  if (n <= 0) return CHAIN_HEAT[0];
  const t = clamp((n - 1) / 15, 0, 1);
  return CHAIN_HEAT[Math.round(t * (CHAIN_HEAT.length - 1))];
} // the octave

/* ---------- internal resolution (OutRun's own) ------------------ */
const VW = 224, VH = 320;   // portrait, matching Dark Star and Sneca

/* Every atmospheric value is a curve over bars, not a flag on a section.
   Flags step; curves cross-fade. Rain now arrives, peaks and clears, and
   the rainbow comes out AFTER it as the sun returns, which is the only
   order that makes sense. */
function keyed(keys, x){
  let a=keys[0], b=keys[keys.length-1];
  for(let i=0;i<keys.length-1;i++){
    if(x>=keys[i][0] && x<=keys[i+1][0]){ a=keys[i]; b=keys[i+1]; break; }
  }
  if(x<=keys[0][0]) return keys[0][1];
  if(x>=b[0] && b===keys[keys.length-1]) return b[1];
  const t=(b[0]===a[0])?0:clamp((x-a[0])/(b[0]-a[0]),0,1);
  return lerp(a[1], b[1], t*t*(3-2*t));
}

/* A fork of lightning: one main channel down from the top of the sky,
   throwing branches off it. The last element of a segment is 2 for the
   main channel and 1 for a branch, so the main one can be drawn heavier. */
function makeBolt(){
  const seg = [], bottom = VH*0.37;
  let x = rnd(VW*0.20, VW*0.80), y = 0;
  while (y < bottom){
    const ny = y + rnd(9, 17), nx = x + rnd(-13, 13);
    seg.push([x,y,nx,ny,2]);
    if (Math.random() < 0.45){
      let fx = nx, fy = ny;
      const n = 3 + (Math.random()*4|0);
      for (let k=0;k<n;k++){
        const gx = fx + rnd(-18,18), gy = fy + rnd(8,16);
        seg.push([fx,fy,gx,gy,1]); fx = gx; fy = gy;
      }
    }
    x = nx; y = ny;
  }
  return seg;
}

/* The three fork strikes, placed on the synth lasers rather than thrown
   at random. Written as bar.beat.sixteenth, all counted from one, so
   28.3.2 is bar 28, third beat, second sixteenth. */
const BOLTS   = [[28,3,2],[29,1,3],[31,1,3]];
const BOLT_T  = BOLTS.map(([bar,beat,six]) =>
                  (bar-1)*BAR + ((beat-1)*4 + (six-1))*TICK);

/* Daylight as a smooth curve rather than a step per section, so the
   eclipse creeps in over twelve bars instead of switching on. */
const LIGHT_KEYS = [[1,0.80],[6,0.94],[9,1.00],[26,1.00],[29,0.62],[33,0.80],
                    [45,0.95],[49,0.92],[55,0.72],[58,0.44],[61,0.34],[68,0.34],
                    [70,1.05],[77,0.92],[88,0.88],[93,0.82],[97,0.78]];
function lightAt(barF){
  let a=LIGHT_KEYS[0], b=LIGHT_KEYS[LIGHT_KEYS.length-1];
  for(let i=0;i<LIGHT_KEYS.length-1;i++){

  return lerp(a[1], b[1], t*t*(3-2*t));
}

function sectionForBar(bar){
  let s = SECTIONS[0];
  for (const sec of SECTIONS) if (bar >= sec.bar) s = sec; else break;
  return s;
}
function sectionEndBar(sec){
  const i = SECTIONS.indexOf(sec);
  return (i === SECTIONS.length - 1) ? TOTAL_BARS + 1 : SECTIONS[i + 1].bar;
}

/* ============================================================
   UTILITIES
   ============================================================ */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a + (b-a)*t;
const smooth= t => t*t*(3-2*t);
const rnd   = (a,b)=> a + Math.random()*(b-a);

/* pal() hands back "#rrggbb" when a section is settled and "rgb(r,g,b)" while
   one is crossfading into the next. Anything that wants to mix or fade a
   palette colour has to cope with both, or it works for most of a run and
   falls over for one bar at every section change. */
function hex(c){
  if (c[0] === "#")
    return [parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)];
  const m = c.match(/-?\d+/g) || [0,0,0];
  return [+m[0], +m[1], +m[2]];
}
function rgba(c, a){
  const A = hex(c);
  return "rgba("+A[0]+","+A[1]+","+A[2]+","+a+")";
}
function mixHexRaw(a,b,t){
  const A=hex(a),B=hex(b);
  const h2=n=>Math.round(n).toString(16).padStart(2,"0");
  return "#"+h2(lerp(A[0],B[0],t))+h2(lerp(A[1],B[1],t))+h2(lerp(A[2],B[2],t));
}
/* multiply a colour down toward black: the dark half of a band */
function shade(c, k){
  const A = hex(c), m = 1 - k;
  return "rgb("+Math.round(A[0]*m)+","+Math.round(A[1]*m)+","+Math.round(A[2]*m)+")";
}
function mixHex(a,b,t){
  const A=hex(a),B=hex(b);
  return "rgb("+Math.round(lerp(A[0],B[0],t))+","+Math.round(lerp(A[1],B[1],t))+","+
                Math.round(lerp(A[2],B[2],t))+")";
}
/* palette that crossfades over one bar when a section changes */
function pal(key, idx){
  const a = state.prevSection, b = state.section, t = state.blend;
  const pick = (o,i) => i===undefined ? o[key] : o[key][Math.min(i, o[key].length-1)];
  const av = pick(a, idx), bv = pick(b, idx);
  return t >= 1 ? bv : mixHex(av, bv, t);
}

/* Every sky is three stops. A section with two would be read at index 2
   by the cross-fade while the other side had three, which returned
   undefined, threw inside render, and killed the animation loop. That is
   the bar 77 hang: the swell was the first section with a third colour. */
for (const sec of SECTIONS){
  if (sec.sky.length === 2) sec.sky = [sec.sky[0], mixHexRaw(sec.sky[0], sec.sky[1], 0.5), sec.sky[1]];
}

/* ============================================================
   AUDIO — placeholder 85bpm click. Master clock lives here.
   ============================================================ */
const Audio8 = {
  ctx:null, master:null, el:null, running:false, ready:false,
  t:0, nextTick:0, clickOn:false, noise:null,

  init(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.5;
    this.master.connect(this.ctx.destination);
    const n = this.ctx.sampleRate * 0.4;
    this.noise = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = Math.random()*2-1;

    Sfx.attach(this.ctx);

    this.el = new Audio();
    this.el.src = AUDIO_SRC;
    this.el.preload = "auto";
    this.el.addEventListener("canplaythrough", ()=>{ this.ready = true; });
    this.el.addEventListener("error", ()=>{ this.ready = false; this.failed = true; });
    this.el.load();
  },

  start(){
    this.init();
    if (this.ctx.state === "suspended") this.ctx.resume();
    this.t = 0; this.nextTick = 0; this.running = true;
    try { this.el.currentTime = 0; const p = this.el.play(); if (p) p.catch(()=>{}); } catch(e){}
  },
  stop(){ this.running = false; try { this.el.pause(); } catch(e){} },

  /* Pause holds the track and the whole scheduler. The music clock is read
     from the element, so freezing the element freezes the game's sense of
     time, which is the only thing that matters here. */
  hold(){ try { this.el.pause(); } catch(e){}
          if (this.ctx && this.ctx.state === "running") this.ctx.suspend(); },
  letGo(){ if (this.ctx) this.ctx.resume();
           try { const p = this.el.play(); if (p) p.catch(()=>{}); } catch(e){} },

  /* Smoothed music clock. HTMLAudio.currentTime updates in coarse steps and
     jitters, so we free-run and slew towards it rather than trusting it
     frame to frame. Big jumps (a seek, a stall) snap. */
  tick(dt){
    if (!this.running) return;
    this.t += dt;
    if (!this.el || this.failed) return;
    const raw = this.el.currentTime - AUDIO_OFFSET;
    if (raw <= 0) return;
    const d = raw - this.t;
    if (Math.abs(d) > 0.30) this.t = raw;
    else this.t += d * Math.min(1, dt * 3);
  },
  now(){ return this.running ? this.t : 0; },

  tone(t, freq, dur, type, gain, glideTo){
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.02);
  },
  /* one rung of the ladder */
  note(step, extra){
    if (!this.ctx) return;
    const t = this.ctx.currentTime + 0.005;
    const semi = CHAIN_SCALE[Math.min(step, CHAIN_CAP)];
    const f = CHAIN_ROOT * Math.pow(2, semi/12);
    this.tone(t, f, 0.30, "triangle", 0.16);
    this.tone(t, f*2, 0.16, "sine", 0.07);
    if (extra){                              // past the octave it shimmers
      this.tone(t+0.055, f*2, 0.34, "sine", 0.05);
      this.tone(t+0.110, f*3, 0.26, "sine", 0.03);
    }
  },
  hit(t, dur, gain, hp){
    const s = this.ctx.createBufferSource(); s.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value = hp||1200;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t+dur+0.02);
  },

  /* Optional click layer for checking sync, on the SIXTEENTH grid.
     Toggle with M. Off by default now the master is in. */
  pump(){
    if (!this.running || !this.ctx) return;
    const music = this.now();
    if (!this.clickOn){ this.nextTick = Math.max(this.nextTick, Math.floor(music/TICK)+1); return; }
    const aheadMusic = music + 0.15;
    let guard = 0;
    while (this.nextTick * TICK < aheadMusic && guard++ < 64){
      const i = this.nextTick++;
      const when = this.ctx.currentTime + (i*TICK - music);
      if (when < this.ctx.currentTime + 0.005) continue;
      const bar = Math.floor(i/TICKS_BAR) + 1;
      const k   = i % TICKS_BAR;
      if (bar > TOTAL_BARS) continue;
      this.tone(when, k%2 ? 233.08 : 174.61, 0.038, "square", 0.045);   // wurli 16ths
      if (k===0  || k===8)  this.tone(when, 110, 0.10, "sine", 0.26, 44); // kick 1 and 3
      if (k===4  || k===12) this.hit(when, 0.09, 0.15, 1400);            // snare 2 and 4
      if (bar>=9 && k%4===2) this.hit(when, 0.04, 0.05, 2600);           // offbeat guitar
      if (bar===68 && k===0) this.tone(when, 1800, 0.55, "sawtooth", 0.12, 120);
    }
  }
};


/* ============================================================
   SFX — Mike's recordings

   Three of these are continuous (engine, kerb, verge) and stay as small
   lossless WAVs, because a lossy loop ticks once every cycle. The rest are
   one-shots and are mp3, which cuts the set from 4.7MB to under half a meg.

   Two things are measured from the audio itself at load rather than typed in
   as constants, so swapping a file in just works:

     HEAD  every decoded buffer is scanned for its first audible sample. That
           absorbs both the silence Mike left at the top and the priming delay
           an mp3 decoder adds, so a one-shot fires exactly when asked.

     SYNC  pass.wav has to START BEFORE the overtake, because the moment the
           sound drops away is the moment you go past. The drop is found by
           walking back from the loudest point to the last frame still near
           it, and that offset becomes the lead time.
   ============================================================ */
/* Mike's masters stay in audio/sfx/ as 4.7MB of wav. What the browser
   downloads is this: the same set at 490KB, in audio/fx/. */
const SFX_DIR   = "audio/fx/";
/* The ladder Mike settled on. It sits around 1-2kHz already, so no octave
   shift, and the top note carries its own level because it was sitting right
   where the rungs needed lifting. */
const CHAIN_GAIN = 0.30, CHAIN_TOP_GAIN = 0.24;
const CHAIN_HOLD   = 4.6;
const SFX_FILES = {
  engine:"engine.wav", kerb:"kerb.wav", verge:"verge.wav",
  chain1:"chain1a.mp3", chain2:"chain2a.mp3", chain3:"chain3a.mp3", chain4:"chain4a.mp3",
  chain5:"chain5a.mp3", chain6:"chain6a.mp3", chain7:"chain7a.mp3", chain8:"chain8a.mp3",
  chain_top:"chain_topa.mp3",
  pass:"pass.mp3", hit:"hit.mp3", timeout:"timeout.mp3", skid:"skid.mp3",
  finish:"finish.mp3", start:"start.mp3"
};

const Sfx = {
  bytes:{}, buf:{}, head:{}, loops:{}, bus:null, ctx:null,
  /* Mike measured the drop in pass.wav at 0.90s. The automatic reading lands
     a shade before that, so it is nudged onto his figure. */
  passLead:0.85, passTrim:0.06, live:0, muted:false,

  /* S kills the effects and leaves the music alone, which is what Mike asked
     for and is also the useful half: the track is the point of the game. One
     gain node carries every effect, so muting is one ramp rather than chasing
     down each loop, and the loops keep running silently so nothing has to be
     rebuilt when it comes back. */
  mute(on){
    this.muted = on;
    if (this.ctx && this.bus) this.bus.gain.setTargetAtTime(on ? 0 : 1, this.ctx.currentTime, 0.03);
  },

  /* Bytes first, with no audio context in sight: this can run the moment the
     page loads, long before the browser will let us make any noise. */
  prefetch(){
    for (const k in SFX_FILES){
      fetch(SFX_DIR + SFX_FILES[k]).then(r => r.ok ? r.arrayBuffer() : null)
        .then(b => { if (b) this.bytes[k] = b; if (this.ctx) this.decode(k); })
        .catch(()=>{});
    }
  },

  attach(ctx){
    if (this.ctx) return;
    this.ctx = ctx;
    this.bus = ctx.createGain();
    this.bus.gain.value = this.muted ? 0 : 1;      // muted before the first gesture stays muted
    this.bus.connect(ctx.destination);
    for (const k in this.bytes) this.decode(k);
  },

  decode(k){
    const b = this.bytes[k]; if (!b || this.buf[k]) return;
    delete this.bytes[k];
    this.ctx.decodeAudioData(b, buffer => {
      this.buf[k] = buffer;
      this.head[k] = this.firstSound(buffer);
      if (k === "pass") this.passLead = this.dropPoint(buffer) - this.head[k] + this.passTrim;
    }, ()=>{});
  },

  /* first sample above a floor, so nothing fires late */
  firstSound(b){
    const d = b.getChannelData(0), step = 32;
    let peak = 0;
    for (let i=0;i<d.length;i+=step) { const v = Math.abs(d[i]); if (v > peak) peak = v; }
    const floor = Math.max(0.004, peak*0.02);
    for (let i=0;i<d.length;i+=step) if (Math.abs(d[i]) > floor) return Math.max(0, (i-step)/b.sampleRate);
    return 0;
  },

  /* the last moment the sound is still near its loudest: for a whoosh, the
     instant it starts falling away, which is the instant you go past */
  dropPoint(b){
    const d = b.getChannelData(0), win = Math.round(b.sampleRate*0.02);
    let best = 0, bestI = 0;
    const rms = [];
    for (let i=0;i+win<d.length;i+=win){
      let s = 0; for (let j=i;j<i+win;j++) s += d[j]*d[j];
      const r = Math.sqrt(s/win); rms.push(r);
      if (r > best){ best = r; bestI = rms.length-1; }
    }
    let k = bestI;
    while (k+1 < rms.length && rms[k+1] > best*0.82) k++;
    return (k+1)*win / b.sampleRate;
  },

  ready(k){ return !!this.buf[k]; },

  play(k, gain, rate, delay){
    if (!this.ctx || !this.buf[k]) return null;
    const src = this.ctx.createBufferSource();
    src.buffer = this.buf[k];
    src.playbackRate.value = rate || 1;
    const g = this.ctx.createGain(); g.gain.value = gain === undefined ? 0.8 : gain;
    src.connect(g); g.connect(this.bus);
    src.start(this.ctx.currentTime + (delay || 0), this.head[k] || 0);
    src.__g = g;
    return src;
  },

  /* fade a one-shot out rather than cutting it, so stopping never clicks */
  release(src, secs){
    if (!src || !this.ctx) return;
    const t = this.ctx.currentTime, s = secs || 0.12;
    try { src.__g.gain.setTargetAtTime(0.0001, t, s/3); src.stop(t + s); } catch(e){}
  },

  /* a loop that can be leaned on every frame: gain and rate glide */
  hold(k, on, gain, rate){
    if (!this.ctx || !this.buf[k]) return;
    let L = this.loops[k];
    if (on && !L){
      const src = this.ctx.createBufferSource();
      src.buffer = this.buf[k]; src.loop = true;
      src.loopStart = this.head[k] || 0;
      src.loopEnd   = this.buf[k].duration;
      const g = this.ctx.createGain(); g.gain.value = 0;
      src.connect(g); g.connect(this.bus);
      src.start(this.ctx.currentTime, src.loopStart);
      L = this.loops[k] = { src, g };
    }
    if (!L) return;
    const t = this.ctx.currentTime;
    L.g.gain.setTargetAtTime(on ? gain : 0, t, 0.05);
    if (rate) L.src.playbackRate.setTargetAtTime(rate, t, 0.06);
    if (!on && L.g.gain.value < 0.0015){
      try { L.src.stop(t + 0.1); } catch(e){}
      delete this.loops[k];
    }
  },

  silence(){
    this.live = 0;
    for (const k in this.loops){
      try { this.loops[k].g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.04);
            this.loops[k].src.stop(this.ctx.currentTime + 0.25); } catch(e){}
      delete this.loops[k];
    }
  }
};
Sfx.prefetch();

/* ============================================================
   STATE
   ============================================================ */
const state = {
  mode:"title",                 // title | play | over | finish
  section:SECTIONS[0], prevSection:SECTIONS[0], blend:1,
  bar:1, musicT:0,
  position:0, playerX:0, speed:0, throttle:1,
  lean:0, finishAt:0, steerNow:0, timeAdd:0, timeAddV:0, ridge:null,
  segments:[], genCurve:0, genY:0, genBar:0,
  barStart:[], roadBarCursor:1,
  scenery:[], traffic:[], meteors:[], fxQueue:[],
  lastTick:-1, nextTick:0,
  timeLeft:20, score:0, crashT:0, shake:0,
  banner:0, bannerSec:null, cue:"", cueT:0,
  paused:false, wet:0, smoke:[], smokeT:0, sfxMsg:0, startSrc:null, skidT:0, lastSteer:0,
  chainSrc:null, setNote:0,
  light:0.5, eclipse:0, moonX:-3.4, night:false,
  bolt:null, boltT:0, boltIx:0, nextBolt:0, flashT:0, rain:0, chill:1, cloud:0, traffic_mul:1, city:0, dust:0, rainbow:0, rainDrops:[],
  nextCheckpointBar:0, checkpointFlash:0,
  hitFlash:0, snareFlash:0, kickFlash:0, chain:0, chainT:0, pop:null, bestChain:0,
  stars:[]
};
for (let i=0;i<340;i++) state.stars.push({x:Math.random(), y:Math.random()*0.92,
  b:0.30 + Math.pow(Math.random(),1.7)*0.70});

/* ============================================================
   ROAD GENERATION — lazy, driven by the current musical section
   ============================================================ */
function pushSegment(y1, y2, curve){
  const i = state.segments.length;
  state.segments.push({
    index:i, curve:curve,
    p1:{ world:{y:y1, z:i*SEGLEN},     camera:{}, screen:{} },
    p2:{ world:{y:y2, z:(i+1)*SEGLEN}, camera:{}, screen:{} },
    colour:(Math.floor(i/RUMBLE_LEN) % 2) ? "dark" : "light",
    /* Dashes used to be drawn only on light segments, so the markings turned
       on and off with the banding and the two patterns read as one flicker.
       They now run on their own count, offset half a band, so they straddle
       the joins the way paint on a real road does. */
    dash:(Math.floor((i + RUMBLE_LEN/2)/DASH_LEN) % 2) === 0,
    clip:0
  });
}
/* One chunk of road per bar of music, indexed by bar, so the composed
   table and the arrangement stay in step. Chunk length is the NOMINAL
   distance for that section, not the player's current speed, so the road
   is deterministic; the speed servo in update() keeps the car on it. */
function generateBar(){
  const b   = state.genBar + 1;
  const sec = sectionForBar(Math.min(((b-1)%TOTAL_BARS)+1, TOTAL_BARS));
  const row = ROAD[((b-1)%TOTAL_BARS)] || {c:0, h:0};   // the road loops if you dawdle
  const n   = SEGS_PER_BAR;

  state.barStart[b] = state.segments.length;
  /* The last few bars run straight and level into the line. On a corner the
     banner ends up off to one side and half out of frame, and the finish is
     the one shot in the game that has to compose. */
  const bb = ((b-1)%TOTAL_BARS)+1;
  const runIn = bb >= FINISH_BAR - 2;
  const curveTarget = runIn ? 0 : row.c * 1.75;
  const hillDelta   = runIn ? 0 : row.h * 1600;
  const startY = state.genY, startC = state.genCurve;
  for (let i=0;i<n;i++){
    const e0 = smooth(i/n), e1 = smooth((i+1)/n);
    pushSegment(startY + hillDelta*e0, startY + hillDelta*e1, lerp(startC, curveTarget, e0));
  }
  state.genCurve = curveTarget;
  state.genY     = startY + hillDelta;
  state.genBar   = b;
  state.barStart[b+1] = state.segments.length;      // provisional end
}
function ensureRoad(){
  const need = Math.floor((state.position + PLAYER_Z)/SEGLEN) + DRAW_DIST + SEGS_PER_BAR;
  while (state.segments.length < need) generateBar();
}
const segAt = z => state.segments[clamp(Math.floor(z/SEGLEN), 0, state.segments.length-1)];

/* ============================================================
   SCENERY — spawned on eighth notes, arrives on the beat
   ============================================================ */
/* "block" was a tower block drawn at roadside scale, which put four-storey
   buildings the size of a fir tree along the verge. Gone; the city on the
   horizon does that job properly. */
const OBJ_TYPES = ["tree","tree","tree","rock","sign","post"];
/* offset 1.0 is exactly the edge of the tarmac, and an object is about 0.155
   wide, so anything under about 1.2 is standing on the kerb. Start on the
   grass. */
const VERGE = 1.34;
const SCENERY_LOOKAHEAD = 14;   // ticks of travel time = 2.47 s at 100%
const LANES = [-0.62, 0, 0.62];

/* Objects are scheduled by the SIXTEENTH they must arrive on, then given
   ~2.5 s of road. Their z is re-solved every frame from the current speed,
   so they land on the tick whatever the player does. */
function spawnScenery(){
  const now   = state.musicT;
  const limit = now + SCENERY_LOOKAHEAD * TICK;
  let guard = 0;
  while (state.nextTick * TICK < limit && guard++ < 400){
    const i      = state.nextTick++;
    const arrive = i * TICK;
    const bar    = Math.floor(i/TICKS_BAR) + 1;
    const k      = i % TICKS_BAR;
    if (bar > TOTAL_BARS) break;
    if (arrive < now) continue;

    const sec  = sectionForBar(bar);
    const down = k === 0;
    const d    = sec.density;
    // density 1 = every 16th, 0.5 = every 8th, 0.25 = every quarter
    const place = d >= 1 ? true : (d >= 0.5 ? k % 2 === 0 : k % 4 === 0);
    if (!place) continue;

    for (const side of [-1, 1]){
      if (!down && Math.random() < 0.22) continue;
      const type = down && Math.random() < 0.35 ? "sign"
                 : OBJ_TYPES[(Math.random()*OBJ_TYPES.length)|0];
      state.scenery.push({
        arrive, side, offset: side * rnd(VERGE, VERGE + 1.35), type,
        scale: down ? rnd(1.15,1.7) : rnd(0.75,1.2),
        tint: (Math.random()*3)|0, z:0
      });
    }

  }

  for (let i=state.fxQueue.length-1; i>=0; i--){
    if (state.fxQueue[i].at <= now){
      if (state.fxQueue[i].kind === "meteor")
        state.meteors.push({ t:0, x:rnd(0.05,0.95), y:rnd(0.05,0.4),
                             vx:rnd(-0.5,-0.15), vy:rnd(0.12,0.3), life:rnd(0.6,1.2) });
      state.fxQueue.splice(i,1);
    }
  }
}

/* ============================================================
   TRAFFIC — three lanes, and never all three blocked at once, so
   there is always a way through.
   ============================================================ */
const CAR_HALF_W  = 0.155;          // matches the drawn sprite
const CAR_HALF_Z  = SEGLEN * 0.9;

function spawnTraffic(dt){
  const want = Math.max(1, Math.round((state.night ? 5 : 7) * (state.traffic_mul || 1)));
  if (state.traffic.length >= want) return;
  if (Math.random() > dt * 2.6 * (state.traffic_mul || 1)) return;

  const z = state.position + PLAYER_Z + rnd(DRAW_DIST*0.55, DRAW_DIST*0.95)*SEGLEN;
  // which lanes are already taken anywhere near this stretch of road?
  const taken = new Set();
  for (const c of state.traffic) if (Math.abs(c.z - z) < SEGLEN*26) taken.add(c.lane);
  const free = [0,1,2].filter(l => !taken.has(l));
  if (free.length <= 1) return;                    // always leave a gap
  const lane = free[(Math.random()*free.length)|0];

  state.traffic.push({
    z, lane, offset: LANES[lane] + rnd(-0.16,0.16),
    speed: BASE_SPEED * rnd(0.40, 0.62),
    colour: (Math.random()*5)|0,
    racer: Math.random() < 0.22
  });
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt){
  /* Paused means paused: no clock, no timer, no spawns. Everything downstream
     reads state.musicT, so holding the audio holds the world. */
  if (state.paused) return;
  Audio8.tick(dt);
  Audio8.pump();

  if (state.mode !== "play"){
    state.banner = Math.max(0, state.banner - dt);
    Sfx.hold("engine", false, 0); Sfx.hold("kerb", false, 0); Sfx.hold("verge", false, 0);
    return;
  }

  /* --- musical clock --------------------------------------- */
  state.musicT = Audio8.now();
  const barF = state.musicT / BAR;
  const bar  = Math.floor(barF) + 1;

  if (bar > TOTAL_BARS){ finish(); return; }
  /* The chequered band is placed by arrival time, the same way the scenery
     is: its position is re-solved every frame from the CURRENT speed so it
     reaches the car on the downbeat of FINISH_BAR whatever the player does
     with the throttle. When it gets there, the run is over.

     There used to be a gantry with a banner on it, and an outro where the
     camera parked at the line while the car drove away into the distance.
     Every version of that looked like the car being sucked into the sign.
     A band of squares on the tarmac and a hard cut to the end screen is the
     honest version and it cannot go wrong. */
  if (state.musicT > FINISH_T - 9){
    state.finishAt = state.position + PLAYER_Z + state.speed*(FINISH_T - state.musicT);
    if (state.musicT >= FINISH_T){ finish(); return; }
  }


  if (bar !== state.bar){
    state.bar = bar;
    const sec = sectionForBar(bar);
    if (sec !== state.section){
      state.prevSection = state.section;
      state.section = sec;
      state.blend = 0;
      // checkpoint: section boundaries top the clock up
      const secBars = sectionEndBar(sec) - sec.bar;
      const was = state.timeLeft;
      state.timeLeft = Math.min(TIME_CAP, state.timeLeft + secBars * BAR + 6);
      state.timeAddV = Math.round(state.timeLeft - was);
      if (state.timeAddV > 0) state.timeAdd = 2.2;
      state.checkpointFlash = 0.9;
    }
  }
  state.cueT = Math.max(0, state.cueT - dt);
  state.blend = Math.min(1, state.blend + dt / (BAR*3.5));
  state.light = lightAt(barF + 1);
  const bf = barF + 1;
  state.eclipse = bf<49 ? 0 : bf<61 ? (bf-49)/12 : bf<68 ? 1 : bf<72 ? 1-(bf-68)/4 : 0;
  state.moonX   = keyed(MOON_X, bf);
  state.night = state.light < 0.32;
  state.rain    = keyed(W_RAIN, bf);
  state.chill   = keyed(W_CHILL, bf);
  state.traffic_mul = keyed(W_TRAFFIC, bf);
  state.city = keyed(CITY, bf);
  state.cloud   = keyed(W_CLOUD, bf);
  state.dust    = keyed(W_DUST, bf);
  state.rainbow = keyed(W_RAINBOW, bf);
  state.wet     = keyed(W_WET, bf);

  /* Lightning. Three fork strikes, landing on the synth lasers at 28.3.2,
     29.1.3 and 31.1.3. A while loop rather than an if, so a dropped frame
     can't swallow one. Between the strikes the sky flickers on its own,
     with no fork, so the storm still breathes without stealing the hits. */
  while (state.boltIx < BOLT_T.length && state.musicT >= BOLT_T[state.boltIx]){
    state.bolt = makeBolt(); state.boltT = 0.54; state.boltIx++;
  }
  if (state.boltT > 0) state.boltT = Math.max(0, state.boltT - dt);

  if (state.rain > 0.45){
    if (state.musicT > state.nextBolt){
      state.nextBolt = state.musicT + rnd(1.7, 3.6);
      state.flashT = 0.18;
    }
  } else { state.nextBolt = state.musicT + 1.2; }
  state.flashT = Math.max(0, state.flashT - dt);


  /* --- speed, then steering -------------------------------- */
  const pSeg = segAt(state.position + PLAYER_Z);

  const tgt = BASE_SPEED * state.throttle;
  state.speed += (tgt - state.speed) * clamp((state.speed < tgt ? 2.2 : 7.5)*dt, 0, 1);
  if (state.crashT > 0){ state.crashT -= dt; state.speed *= (1 - 2.4*dt); }
  state.speed = Math.max(BASE_SPEED*0.12, state.speed);

  const dz = state.speed * dt;
  state.position += dz;
  ensureRoad();

  const speedPct = state.speed / BASE_SPEED;
  /* A touch wheel gives a continuous axis; keys give -1/0/+1. Whichever
     is being used wins. */
  /* Straight digital steering. The analogue wheel is gone, so there is no
     second source arguing with this one. */
  const steer = (input.left?-1:0)+(input.right?1:0);
  state.steerNow = steer;
  state.playerX += steer * STEER_RATE * dt * clamp(speedPct, 0.6, 1.0);

  /* A chirp of lost traction on turn-in: once per press, not while held,
     and only when there is speed to lose. */
  state.skidT = Math.max(0, state.skidT - dt);
  if (steer !== 0 && state.lastSteer === 0 && speedPct > 0.4 && state.skidT <= 0){
    state.skidT = 0.22;
    Sfx.play("skid", 0.10, 0.96 + Math.random()*0.10);
  }
  state.lastSteer = steer;

  state.playerX -= pSeg.curve * dz * CENTRIFUGAL;
  state.playerX = clamp(state.playerX, -3.2, 3.2);

  const offRoad = Math.abs(state.playerX) > 1.05;
  if (offRoad){
    state.speed *= (1 - 1.6*dt);
    state.shake  = Math.max(state.shake, 1.2);
  }

  /* Tyre smoke. Screen-space puffs off the rear wheels while the wheel is
     turned and there is speed to scrub. They drift outward and down the
     screen, which is the world moving past, and swell as they thin out. */
  state.smokeT -= dt;
  /* Two kinds of puff off the same rear wheels, and never both at once. On
     tarmac it is a wisp of rubber smoke, and only when you turn in hard enough
     to scrub. On the grass it is dust, which does not wait for you to steer:
     the wheels throw it up the whole time you are out there.

     There was a third for a day, spray off standing water in the rain bars.
     Two plumes of pale particles either side of the car read as smoke however
     they were coloured or shaped, and in the wet section, which is the busiest
     part of the track, they were one thing too many. Removed rather than
     tuned: the puddles already say the road is wet. */
  const KIND = { SMOKE:0, DUST:1 };
  const kind = (offRoad && speedPct > 0.18)     ? KIND.DUST
             : (steer !== 0 && speedPct > 0.45) ? KIND.SMOKE
             : -1;
  if (kind >= 0 && state.smokeT <= 0){
    state.smokeT = [0.038, 0.022][kind];
    for (const w of [-1, 1]) for (let n = 0, per = kind === KIND.SMOKE ? 1 : 2; n < per; n++){
      const p = { t:0, kind };
      if (kind === KIND.DUST){
        /* Thrown OUTWARD hard, because anything spawned tight behind the car
           is drawn under it and never seen. */
        p.x = VW/2 + w*30 + rnd(-3,3);      p.y  = VH - 16 + rnd(-2,2);
        p.vx = w*rnd(34, 62);               p.vy = rnd(-14, 4);
        p.r  = rnd(3.0, 5.6);               p.grow = 17;
        p.life = rnd(0.55, 1.05);
      } else {
        /* rubber only really comes off the outside wheel */
        const loaded = (w === -Math.sign(steer)) ? 1 : 0.62;
        p.x = VW/2 + w*27 + rnd(-3,3);      p.y  = VH - 21 + rnd(-2,2);
        p.vx = w*14 - steer*26 + rnd(-8,8); p.vy = rnd(1, 9);
        p.r  = rnd(2.0, 3.4) * loaded;      p.grow = 8.5;
        p.life = rnd(0.34, 0.58) * loaded;
      }
      state.smoke.push(p);
    }
  }
  for (let i=state.smoke.length-1; i>=0; i--){
    const s = state.smoke[i];
    s.t += dt;
    if (s.t >= s.life){ state.smoke.splice(i,1); continue; }
    s.x += s.vx*dt; s.y += s.vy*dt; s.r += (s.grow || 8.5)*dt;
  }

  /* The three continuous sounds. The engine follows the speedo; the rumble
     strip and the grass follow where the car actually is. */
  const spd = clamp(state.speed / BASE_SPEED, 0, 1.4);
  Sfx.hold("engine", true, 0.075 + 0.065*spd, 0.58 + 0.72*spd);
  const onKerb = !offRoad && Math.abs(state.playerX) > 0.90;
  Sfx.hold("kerb",  onKerb, 0.72, 0.85 + 0.35*spd);
  Sfx.hold("verge", offRoad, 0.66, 0.80 + 0.40*spd);

  /* Cosmetic only. The body leans into the load so the 3D model has
     something to do. It does not affect where the car goes. */
  const leanTo = clamp(steer*0.13 + pSeg.curve*0.011, -0.21, 0.21);
  state.lean += (leanTo - state.lean) * Math.min(1, 6*dt);

  /* --- throttle -------------------------------------------- */
  const tTarget = input.up ? THROTTLE_MAX : (input.down ? THROTTLE_MIN : 0.90);
  state.throttle += (tTarget - state.throttle) * clamp(3.4*dt, 0, 1);

  /* --- scenery: solve z so each object lands on its beat ---- */
  spawnScenery();
  const now = state.musicT;
  for (let i=state.scenery.length-1; i>=0; i--){
    const o = state.scenery[i];
    o.z = state.position + PLAYER_Z + state.speed * (o.arrive - now);
    if (o.z < state.position - SEGLEN*4){ state.scenery.splice(i,1); continue; }
    if (o.solid && !o.hit && Math.abs(o.z - (state.position+PLAYER_Z)) < SEGLEN*1.2){
      if (Math.abs(o.offset - state.playerX) < 0.20){ o.hit = true; crash(0.6); }
    }
  }

  /* --- traffic --------------------------------------------- */
  spawnTraffic(dt);
  for (let i=state.traffic.length-1;i>=0;i--){
    const c = state.traffic[i];
    c.z += c.speed * dt;
    if (c.racer) c.offset += Math.sin(now*1.3 + c.z*0.0001) * 0.4 * dt;
    if (c.z < state.position - SEGLEN*6 || c.z > state.position + DRAW_DIST*SEGLEN*1.3){
      state.traffic.splice(i,1); continue;
    }
    const dzc = c.z - (state.position + PLAYER_Z);
    const dx  = Math.abs(c.offset - state.playerX);

    /* Arm the whoosh early. The sound peaks and falls away Sfx.passLead
       seconds in, and that fall is the overtake, so it has to be started
       that far before the car is level with you. Only for cars close enough
       across the road to be worth hearing, and never more than two at once
       or the road turns to mush. */
    if (!c.armed && dx < 1.05){
      const closing = state.speed - c.speed;
      if (closing > 0){
        const tPass = dzc / closing;
        if (tPass > 0 && tPass <= Sfx.passLead && Sfx.live < 2){
          c.armed = true; Sfx.live++;
          c.passSrc = Sfx.play("pass", 0.36);
          if (c.passSrc) c.passSrc.onended = () => { Sfx.live = Math.max(0, Sfx.live-1); };
          else Sfx.live = Math.max(0, Sfx.live-1);
        }
      }
    }

    if (Math.abs(dzc) < CAR_HALF_Z && dx < CAR_HALF_W * 2){
      if (!c.bumped){ c.bumped = true; crash(1.0); }
    } else if (Math.abs(dzc) < SEGLEN*2.5 && dx < 0.80 && dx > CAR_HALF_W*2 && !c.near){
      /* A near miss. The tighter the gap and the faster you take it,
         the more it is worth, and the chain keeps climbing. */
      c.near = true;
      const tight = clamp(1 - (dx - CAR_HALF_W*2) / (0.80 - CAR_HALF_W*2), 0, 1);
      const fast  = clamp(state.speed / BASE_SPEED, 0, 1.3);
      addLink(Math.round((70 + 200*tight) * fast));
    }
  }

  /* --- meteors, flashes, clock ------------------------------ */
  for (let i=state.meteors.length-1;i>=0;i--){
    const m = state.meteors[i];
    m.t += dt; m.x += m.vx*dt; m.y += m.vy*dt;
    if (m.t > m.life) state.meteors.splice(i,1);
  }
  const tIdx = Math.floor(state.musicT / TICK);
  if (tIdx !== state.lastTick){
    state.lastTick = tIdx;
    const k = ((tIdx % TICKS_BAR) + TICKS_BAR) % TICKS_BAR;
    if (k===4 || k===12) state.snareFlash = 1;      // backbeat
    if (k===0 || k===8)  state.kickFlash  = 1;      // kick
  }
  state.snareFlash = Math.max(0, state.snareFlash - dt*7.0);
  state.kickFlash  = Math.max(0, state.kickFlash  - dt*7.0);
  state.hitFlash   = Math.max(0, state.hitFlash   - dt*3.0);
  state.checkpointFlash = Math.max(0, state.checkpointFlash - dt*1.4);
  state.shake      = Math.max(0, state.shake - dt*4);
  state.chainT = Math.max(0, state.chainT - dt);
  state.timeAdd = Math.max(0, state.timeAdd - dt);
  if (state.chainT <= 0 && state.chain){
    state.bestChain=Math.max(state.bestChain,state.chain); state.chain = 0;
  }
  if (state.pop){ state.pop.t -= dt; if (state.pop.t<=0) state.pop=null; }
  state.banner     = Math.max(0, state.banner - dt);

  state.score += state.speed * dt * 0.004;
  state.timeLeft -= dt;
  if (state.timeLeft <= 0){ state.timeLeft = 0; gameOver(); }
}

function addLink(base){
  state.chain++;
  /* The chain also lapses on its own if you go this long without threading
     anything, which is what makes it feel like it broke for no reason. Longer
     now, and the rungs drain so you can see it running out. */
  state.chainT = CHAIN_HOLD;
  const step = Math.min(state.chain-1, CHAIN_CAP);
  if (Sfx.ready("chain1")){
    /* One note at a time. These ring for 1.4s and a quick chain would
       otherwise stack five of them into a chord. */
    Sfx.release(state.chainSrc, 0.16); state.chainSrc = null;
    // chain1..8 climb the ladder; past the octave it holds on chain_top
    state.chainSrc = (state.chain > CHAIN_CAP+1)
      ? Sfx.play("chain_top", CHAIN_TOP_GAIN)
      : Sfx.play("chain" + (step+1), CHAIN_GAIN);
  } else Audio8.note(step, state.chain > CHAIN_CAP+1);
  const gain = Math.round(base * Math.min(state.chain, 30));
  state.score += gain;
  state.pop = { t:0.9, v:gain };
}

function crash(mag){
  /* The impact reads first and the chain breaking answers it. Both at once
     was one muddled noise. */
  Sfx.play("hit", clamp(0.42 + 0.32*mag, 0, 1));
  // a whoosh already in the air belongs to a pass that is not going to happen
  for (const c of state.traffic){ if (c.passSrc){ Sfx.release(c.passSrc, 0.08); c.passSrc = null; } }
  state.bestChain = Math.max(state.bestChain, state.chain);
  state.chain = 0; state.chainT = 0;
  state.crashT = 0.45*mag;
  state.shake  = 4*mag;
  state.hitFlash = 1;
  state.score = Math.max(0, state.score - 400*mag);
  state.timeLeft = Math.max(0, state.timeLeft - 2.5*mag);
}
function gameOver(){ state.mode = "over"; Audio8.stop();
  Sfx.silence(); Sfx.play("timeout", 0.8); }
/* Crossing the band ends the run exactly the way the clock running out does:
   straight to the end screen and the initials box. The one difference is
   deliberate: the music is NOT stopped, so the last four bars of the track
   play out underneath. */
function finish(){
  state.mode = "finish";
  state.bestChain = Math.max(state.bestChain, state.chain);
  Sfx.silence();                       // engine, kerb and grass stop with the run
  Sfx.play("finish", 0.75);
  document.body.classList.remove("playing");
  if (typeof LEADERBOARD_ENABLED !== "undefined" && LEADERBOARD_ENABLED && window.Leaderboard)
    Leaderboard.onGameOver(Math.floor(state.score));
}

function startRun(){
  state.mode="play"; state.paused=false;
  state.section = SECTIONS[0]; state.prevSection = SECTIONS[0]; state.blend = 1;
  state.bar=1; state.musicT=0; state.position=0; state.playerX=0;
  state.speed=BASE_SPEED*0.4; state.throttle=0.94;
  state.lean=0; state.finishAt=0; state.timeAdd=0; state.city=0;
  state.segments.length=0; state.genCurve=0; state.genY=0; state.genBar=0;
  state.barStart.length=0; state.roadBarCursor=1;
  state.scenery.length=0; state.traffic.length=0; state.meteors.length=0;
  state.smoke.length=0; state.smokeT=0; state.wet=0;
  Sfx.release(state.startSrc, 0.35); state.startSrc = null;   // the key turn is done
  Sfx.live = 0;                                              // no whooshes owed from last time
  state.skidT=0; state.lastSteer=0;
  state.bolt=null; state.boltT=0; state.boltIx=0; state.nextBolt=0; state.flashT=0;
  state.fxQueue.length=0; state.nextTick=0; state.lastTick=-1; state.timeLeft=34; state.score=0; state.chain=0; state.chainT=0; state.bestChain=0; state.pop=null;
  state.crashT=0; state.shake=0; state.banner=0;
  ensureRoad();
  Audio8.start();
}

/* ============================================================
   RENDER
   ============================================================ */
const out = document.getElementById("screen");
const octx = out.getContext("2d");
const buf = document.createElement("canvas"); buf.width=VW; buf.height=VH;
const ctx = buf.getContext("2d", {alpha:false});

function project(p, camX, camY, camZ){
  p.camera.x = (p.world.x||0) - camX;
  p.camera.y = (p.world.y||0) - camY;
  p.camera.z = (p.world.z||0) - camZ;
  const s = CAM_DEPTH / Math.max(1e-3, p.camera.z);
  p.screen.scale = s;
  p.screen.x = Math.round(VW/2 + s * p.camera.x * VW/2);
  p.screen.y = Math.round(VH/2 - s * p.camera.y * VH/2);
  p.screen.w = Math.round(     s * ROAD_W      * VW/2);
}
function quad(c, x1,y1,w1, x2,y2,w2, col){
  c.fillStyle = col; c.beginPath();
  c.moveTo(x1-w1, y1); c.lineTo(x2-w2, y2); c.lineTo(x2+w2, y2); c.lineTo(x1+w1, y1);
  c.closePath(); c.fill();
}

/* Sega skies are BANDS, not gradients. Hard edges, saturated. */
const SKY_BANDS = 7;
function drawSky(horizon){
  const h = Math.max(horizon, 1);
  /* A two-colour ramp goes muddy through the middle. Sections may carry a
     third, mid-sky colour and the ramp runs top -> mid -> horizon. */
  for (let i=0;i<SKY_BANDS;i++){
    const t0 = i/SKY_BANDS, t1 = (i+1)/SKY_BANDS;
    const u  = Math.pow(t0, 0.78);
    ctx.fillStyle = u < 0.5 ? mixHex(pal("sky",0), pal("sky",1), u*2)
                            : mixHex(pal("sky",1), pal("sky",2), (u-0.5)*2);
    ctx.fillRect(0, Math.floor(t0*h), VW, Math.ceil((t1-t0)*h)+1);
  }
  const w = state.section.weather;

  if (state.light < 0.55){
    const a = clamp((0.55-state.light)/0.45, 0, 1);
    for (const st of state.stars){
      const y = st.y*h; if (y > h-2) continue;
      const tw = 0.6 + 0.4*Math.sin(state.musicT*3.2 + st.b*30);
      ctx.fillStyle = "rgba(255,252,240,"+(a*st.b*tw).toFixed(3)+")";
      ctx.fillRect(Math.round(st.x*VW), Math.round(y), 1, 1);
    }
  }

  /* The sun, with the moon crossing it. At full coverage it is the
     corona, which is why the middle of the track goes dark. */
  const cx = Math.round(VW/2 + state.playerX*-14);
  const cy = Math.round(h - keyed(SUN_H, state.bar)), r = 24, e = state.eclipse;
  if (e >= 0.999){
    const cg = ctx.createRadialGradient(cx,cy,r*0.95, cx,cy,r*3.2);
    cg.addColorStop(0,"rgba(255,240,200,0.95)");
    cg.addColorStop(1,"rgba(255,150,60,0)");
    ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(cx,cy,r*3.2,0,7); ctx.fill();
    ctx.fillStyle="#0a0410"; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill();
    ctx.strokeStyle="#fff6e0"; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(cx,cy,r+1,0,7); ctx.stroke();
  } else if (w!=="rain") {
    ctx.fillStyle="#ffb42a"; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill();
    ctx.fillStyle="#ffe066"; ctx.beginPath(); ctx.arc(cx,cy,r-5,0,7); ctx.fill();
    ctx.fillStyle="#fff6c8"; ctx.beginPath(); ctx.arc(cx,cy,r-11,0,7); ctx.fill();
    if (e > 0.001){                                    // the bite
      /* Driven by the transit, not by the coverage, so the moon carries on
         across and leaves to the right instead of reversing out. The rake
         flattens as it covers, so the crossover into totality is seamless.
         Clipped to the sun, because a new moon is invisible against the sky
         and should not go sailing off as a grey disc once it is clear. */
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.clip();
      ctx.fillStyle=pal("sky",1);
      ctx.beginPath();
      ctx.arc(cx + state.moonX*r, cy - r*0.35*(1-e), r*1.02, 0, 7);
      ctx.fill();
      ctx.restore();
    }
    ctx.strokeStyle="#000"; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.stroke();
  }

  /* Cumulus with flat bottoms and hard edges, drifting at different rates.
     A few are always there so the sky has depth even on a clear day; the
     weather curve adds more and darkens them into nimbus when it rains. */
  /* Clouds thin out and go as the eclipse closes in. A cloudy sky under a
     total eclipse reads as a mistake, and they were sitting over the corona. */
  const clear   = 1 - clamp(state.eclipse*1.6, 0, 1);
  const nClouds = Math.round((3 + Math.round(state.cloud*5)) * clear);
  for (let i=0;i<nClouds;i++){
    const seedY = 0.20 + ((i*0.173) % 0.52);
    const y  = Math.round(h*seedY);
    if (y > h-14) continue;
    const sp = 5 + (i%3)*4;
    const x  = Math.round(((state.musicT*sp + i*97) % (VW+180)) - 90);
    const sz = 9 + (i%4)*4;
    const base = i < 3 ? 0.40 : state.cloud;
    ctx.globalAlpha = clamp(base * (0.75 + 0.25*state.rain), 0, 1);
    const body = mixHex("#ffffff", "#3c4658", clamp(state.rain*0.9,0,1));
    const shade2 = mixHex("#c8d4e4", "#2a3242", clamp(state.rain*0.9,0,1));
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(x,          y,        sz*0.62, Math.PI, 0);
    ctx.arc(x+sz*0.78,  y-sz*0.30, sz*0.80, Math.PI, 0);
    ctx.arc(x+sz*1.70,  y,        sz*0.58, Math.PI, 0);
    ctx.rect(x-sz*0.62, y, sz*2.90, sz*0.42);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade2;
    ctx.fillRect(x-sz*0.62, y+sz*0.20, sz*2.90, sz*0.22);
    ctx.strokeStyle = "rgba(0,0,0,0.55)"; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x,          y,        sz*0.62, Math.PI, 0);
    ctx.arc(x+sz*0.78,  y-sz*0.30, sz*0.80, Math.PI, 0);
    ctx.arc(x+sz*1.70,  y,        sz*0.58, Math.PI, 0);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-sz*0.62, y+sz*0.42);
    ctx.lineTo(x+sz*2.28, y+sz*0.42); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  /* Back inside the sky, ahead of the dust and the horizon haze strip and
     therefore behind the mountains, which is where it has always been. Drawn
     after them instead, the legs land hard on the horizon with nothing
     painted over them, and the haze strip no longer softens the feet. */
  if (state.rainbow > 0.02){
    const rx = VW/2, ry = h+46, cols=["#ff2a2a","#ff8a1e","#ffe81e","#3ad44e","#1e8aff","#a03aff"];
    const grow = state.rainbow;
    for (let i=0;i<cols.length;i++){
      ctx.strokeStyle = cols[i]; ctx.globalAlpha = 0.80*grow; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(rx, ry, 106 - i*4, Math.PI, Math.PI + Math.PI*grow); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  if (state.dust > 0.02){
    ctx.globalAlpha = state.dust*0.35; ctx.fillStyle = "#e0b060";
    ctx.fillRect(0, Math.max(0,h-30), VW, 32); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = pal("haze"); ctx.globalAlpha = 0.85;
  ctx.fillRect(0, Math.max(0, horizon-4), VW, 5); ctx.globalAlpha = 1;
}

/* A blocky skyline, deterministic so it does not shimmer, drawn between
   the mountains and the road. */
/* A stable hash: same input, same number, forever. */
function hash1(n){ const v = Math.sin(n*127.1 + 311.7)*43758.5453; return v - Math.floor(v); }

/* The city on the horizon.

   It used to place buildings at i*17 - (drift % 17), which slid the whole row
   along and then snapped it back every 17px, handing each slot a new width and
   height as it went. The windows were worse: their pattern came from the
   building's SCREEN x, so it crawled through the brickwork as the city moved.
   The result shimmered instead of standing still.

   Now every building has a world index that never recycles. Its width, height
   and window pattern all come from that index, and its screen position is a
   plain subtraction. It is the same building the whole way in. */
function drawCity(horizon, parallax){
  const c = state.city;
  if (c < 0.02) return;
  const base = Math.max(0, horizon);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, VW, base+1); ctx.clip();
  const near = mixHex(pal("mtn"), "#161a2c", 0.55);
  const far  = mixHex(pal("haze"), "#2a3048", 0.62);
  const SPAN = 17;
  for (let layer=0; layer<2; layer++){
    const depth = layer ? 1 : 0.62;
    const col   = layer ? near : far;
    const px    = parallax * 0.03 * (layer ? 1 : 0.55) + (layer ? -5 : 0);
    const first = Math.floor(px / SPAN) - 1;
    for (let k=0; k<Math.ceil(VW/SPAN)+3; k++){
      const idx = first + k;
      const r   = hash1(idx*1.7 + layer*137.3);
      const w   = 7 + Math.floor(r*11);
      const x   = Math.round(idx*SPAN - px);
      if (x > VW+12 || x < -14) continue;
      const h   = Math.round((6 + r*30) * c * depth);
      if (h < 2) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x, base-h, w, h);
      ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 1;
      ctx.strokeRect(x+0.5, base-h+0.5, w-1, h);
      if (layer && h > 9 && c > 0.35){
        ctx.fillStyle = "rgba(255,226,140,"+(0.55*clamp((c-0.35)/0.5,0,1)).toFixed(2)+")";
        // window grid in the building's OWN coordinates, so it stays put
        for (let wy=3; wy<h-3; wy+=5)
          for (let wx=2; wx<w-2; wx+=4)
            if ((idx*29 + wx*7 + wy*13) % 5 < 3) ctx.fillRect(x+wx, base-h+wy, 2, 2);
      }
    }
  }
  ctx.restore();
}

function drawMountains(horizon, parallax){
  const pts = [];
  for (let x=-20; x<=VW+20; x+=4){
    const t = (x + parallax*0.06);
    const hh = 30 + 20*Math.sin(t*0.021) + 13*Math.sin(t*0.047+1.7)
             + 8*Math.sin(t*0.091+0.4) + 4*Math.sin(t*0.213+2.9);
    pts.push([x, Math.round(horizon - hh)]);
  }
  /* Keep the ridge: the eclipse overlay draws stars on top of everything and
     needs to know where the sky stops, or they come out over the rock. */
  state.ridge = pts;
  ctx.fillStyle = pal("mtn");
  ctx.beginPath(); ctx.moveTo(-20, horizon+2);
  for (const [x,y] of pts) ctx.lineTo(x,y);
  ctx.lineTo(VW+20, horizon+2); ctx.closePath(); ctx.fill();
  // black rim along the ridge
  ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (const [x,y] of pts) ctx.lineTo(x,y);
  ctx.stroke();
}

/* ---- procedural sprites: flat fills, hard black edges ---------- */
function ink(w){ ctx.strokeStyle = "#000"; ctx.lineWidth = Math.max(1, Math.min(2.5, w*0.22)); }
function box(x,y,w,h,fill){ ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);
  ctx.strokeRect(Math.round(x)+0.5, Math.round(y)+0.5, Math.max(1,Math.round(w)-1), Math.max(1,Math.round(h)-1)); }

function drawObj(o, x, y, sc, clipY){
  const w = Math.max(1, sc*ROAD_W*VW/2 * 0.155 * o.scale);
  const cols = [pal("obj",0), pal("obj",1), pal("obj",2)];
  const c = cols[o.tint];
  const clipped = y > clipY;
  if (clipped){ ctx.save(); ctx.beginPath(); ctx.rect(0,0,VW,Math.max(0,clipY)); ctx.clip(); }
  ink(w);
  const fine = w > 2.2;                       // no outlines on far specks
  if (!fine) ctx.strokeStyle = "rgba(0,0,0,0)";

  if (o.type === "tree"){
    const h = w*3.2;
    ctx.fillStyle="rgba(0,0,0,.28)"; ctx.fillRect(x-w*0.9, y-1, w*1.8, 2);
    box(x-w*0.16, y-h*0.42, w*0.32, h*0.42, "#5a3418");
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.moveTo(x, y-h); ctx.lineTo(x-w*1.05, y-h*0.42);
    ctx.lineTo(x+w*1.05, y-h*0.42); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y-h*0.78); ctx.lineTo(x-w*1.35, y-h*0.10);
    ctx.lineTo(x+w*1.35, y-h*0.10); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (o.type === "rock"){
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.moveTo(x-w, y); ctx.lineTo(x-w*0.55, y-w*1.25);
    ctx.lineTo(x+w*0.3, y-w*1.55); ctx.lineTo(x+w, y); ctx.closePath();
    ctx.fill(); ctx.stroke();
  } else if (o.type === "sign"){
    const h = w*2.7;
    box(x-w*0.13, y-h, w*0.26, h, "#3a3128");
    box(x-w*1.15, y-h-w*0.95, w*2.3, w*1.5, "#ffffff");
    ctx.fillStyle = "#e0342c"; ctx.fillRect(x-w*0.8, y-h-w*0.66, w*1.6, w*0.38);
    ctx.fillStyle = "#1e6ad4"; ctx.fillRect(x-w*0.8, y-h-w*0.18, w*1.6, w*0.16);
  } else if (o.type === "post"){
    const h = w*1.85;
    box(x-w*0.18, y-h, w*0.36, h, "#ffffff");
    ctx.fillStyle = "#e0342c"; ctx.fillRect(x-w*0.18, y-h, w*0.36, Math.max(1,h*0.26));
  } else if (o.type === "dog"){
    const h = w*1.5;
    box(x-w*0.9,  y-h*0.75, w*1.8,  h*0.45, "#e09a4a");
    box(x+w*0.68, y-h*1.08, w*0.6,  h*0.5,  "#e09a4a");
    box(x+w*0.70, y-h*1.34, w*0.18, h*0.3,  "#c47a34");
    box(x+w*1.04, y-h*1.34, w*0.18, h*0.3,  "#c47a34");
    ctx.fillStyle="#fff2dc";
    ctx.fillRect(x-w*0.85, y-h*0.35, w*0.24, h*0.35);
    ctx.fillRect(x-w*0.25, y-h*0.35, w*0.24, h*0.35);
    ctx.fillRect(x+w*0.35, y-h*0.35, w*0.24, h*0.35);
    ctx.fillRect(x+w*0.72, y-h*0.35, w*0.24, h*0.35);
    box(x-w*1.3, y-h*0.98, w*0.45, h*0.18, "#e09a4a");
    ctx.fillStyle="#000"; ctx.fillRect(x+w*1.06, y-h*0.95, Math.max(1,w*0.14), Math.max(1,w*0.14));
  }
  if (clipped) ctx.restore();
}

function drawCar(c, x, y, sc, clipY){
  const w = Math.max(3, sc*ROAD_W*VW/2 * (CAR_HALF_W*2));
  const h = w*0.68;
  const cols = [["#e0342c","#8f1a14"],["#1e6ad4","#123f82"],
                ["#2fb04e","#166a2c"],["#ffd21e","#a88400"],
                ["#e8e2d4","#a8a294"]];
  const col = cols[c.colour % cols.length];
  const clipped = y > clipY;
  if (clipped){ ctx.save(); ctx.beginPath(); ctx.rect(0,0,VW,Math.max(0,clipY)); ctx.clip(); }
  ink(w);
  if (w <= 2.4) ctx.strokeStyle = "rgba(0,0,0,0)";
  ctx.fillStyle="rgba(0,0,0,.32)"; ctx.fillRect(x-w*0.55, y-2, w*1.1, 3);
  box(x-w*0.5,  y-h,      w,      h,      col[1]);      // rear panel
  box(x-w*0.5,  y-h*0.62, w,      h*0.44, col[0]);
  box(x-w*0.36, y-h*1.06, w*0.72, h*0.42, "#20242c");   // glass
  ctx.fillStyle="#3a5a8a"; ctx.fillRect(x-w*0.30, y-h*1.02, w*0.60, h*0.28);
  ctx.fillStyle = "#ff7a3c";
  ctx.fillRect(x-w*0.44, y-h*0.44, Math.max(1,w*0.16), Math.max(1,h*0.20));
  ctx.fillRect(x+w*0.28, y-h*0.44, Math.max(1,w*0.16), Math.max(1,h*0.20));
  if (w > 9){ ctx.fillStyle="#f0d84a"; ctx.fillRect(x-w*0.13, y-h*0.24, w*0.26, h*0.14); }
  if (clipped) ctx.restore();
}

/* The finishing line: a chequered strip across the road, a banner over it
   on two posts, and Kalinka standing at the verge waiting for you. */
/* A chequered band painted across the track, drawn per road segment so it
   takes the perspective, the camber and the crest exactly the way the lane
   paint does. The phase flips every row, which is what makes it read as a
   chequerboard rather than as a set of stripes.

   It runs kerb to kerb, over the rumble strips rather than stopping at the
   tarmac, because that is what a finish line does and because at a distance
   the extra width is most of what makes it visible at all. Nine segments deep
   for the same reason: a single row aliases into a grey smudge before you are
   anywhere near it. */
const FINISH_W = 1.24;                       // matches the rumble strip
function drawFinishLine(segs, baseIdx){
  const n0 = Math.floor(state.finishAt/SEGLEN) - baseIdx;
  const CELLS = 10;
  for (let r = 0; r < FINISH_ROWS; r++){
    const n = n0 + r;
    if (n < 1 || n >= DRAW_DIST) continue;
    const seg = segs[baseIdx + n]; if (!seg) continue;
    const p1 = seg.p1.screen, p2 = seg.p2.screen;
    if (!p1.scale || p1.w < 1) continue;
    for (let i = 0; i < CELLS; i++){
      const a0 = -FINISH_W + 2*FINISH_W*i/CELLS, a1 = -FINISH_W + 2*FINISH_W*(i+1)/CELLS;
      const am = (a0+a1)/2, ah = (a1-a0)/2;
      quad(ctx, p1.x + p1.w*am, p1.y, p1.w*ah + 0.5,
                p2.x + p2.w*am, p2.y, p2.w*ah + 0.5,
                ((i + r) % 2) ? "#12120f" : "#f2f0e8");
    }
  }
}

/* Flat sprite, drawn straight on. The body shifts a little under load but
   nothing rotates, so there is no angle at which it can look wrong. */
function drawTyreSmoke(){
  for (const s of state.smoke){
    const k = 1 - s.t/s.life;
    const r = Math.max(1, Math.round(s.r));
    // dust takes its colour from the ground it is being thrown off
    ctx.fillStyle = s.kind === 1
      ? rgba(mixHex(pal("ground",0), "#e6c489", 0.74), (0.66*k*k).toFixed(3))
      : "rgba(232,228,218,"+(0.50*k*k).toFixed(3)+")";
    ctx.fillRect(Math.round(s.x)-r, Math.round(s.y)-r, r*2, r*2);
  }
}

function drawPlayerCar(){
  const bob = Math.sin(state.musicT*Math.PI/TICK)*0.5;
  const t   = state.lean*26;
  /* The car sits where it sits. It used to shrink and fade toward a published
     vanishing point during an outro, which read as a tractor beam however it
     was tuned. There is no outro now. */
  const cx = Math.round(VW/2 + state.lean*16
                        + (state.shake ? rnd(-state.shake,state.shake) : 0));
  const cy = Math.round(VH - 24 + bob);
  const w = 54, h = 30;
  ctx.save();

  ctx.strokeStyle="#000"; ctx.lineWidth=2;
  ctx.fillStyle="rgba(0,0,0,.45)";
  ctx.beginPath(); ctx.ellipse(cx, cy+9, w*0.56, 5, 0, 0, 7); ctx.fill();

  box(cx-w/2-3, cy-9, 7, 15, "#141418");                    // wheels
  box(cx+w/2-4, cy-9, 7, 15, "#141418");

  box(cx-w*0.40+t, cy-h-12, w*0.80, 6,  "#15151a");         // roof spoiler
  box(cx-w*0.36+t, cy-h-7,  w*0.72, 17, "#1a2f52");         // tailgate glass
  ctx.fillStyle="#2f4f80"; ctx.fillRect(cx-w*0.31+t, cy-h-5, w*0.62, 9);
  ctx.fillStyle="#a81c14";                                  // pillars
  ctx.fillRect(cx-w*0.40+t, cy-h-7, 4, 17);
  ctx.fillRect(cx+w*0.36+t-4, cy-h-7, 4, 17);

  box(cx-w/2, cy-h+9, w, h-4, "#a81c14");                   // rear panel
  ctx.fillStyle="#c4241a"; ctx.fillRect(cx-w/2+3, cy-h+11, w-6, h-9);
  ctx.fillStyle="#20242c"; ctx.fillRect(cx-w/2+3, cy-h+9, w-6, 3);

  box(cx-w/2+3,  cy-h+15, 10, 13, "#e0402a");               // tall Nova clusters
  box(cx+w/2-13, cy-h+15, 10, 13, "#e0402a");
  ctx.fillStyle="#ffb03a";
  ctx.fillRect(cx-w/2+4, cy-h+16, 8, 4);
  ctx.fillRect(cx+w/2-12, cy-h+16, 8, 4);
  if (input.down){ ctx.fillStyle="#ff5a3c";
    ctx.fillRect(cx-w/2+4, cy-h+21, 8, 6); ctx.fillRect(cx+w/2-12, cy-h+21, 8, 6); }

  /* SECA 900 at 6px is about 29px of monospace and the plate was 26, so both
     ends ran off onto the bodywork and it read ECA 90. */
  box(cx-17, cy-4, 34, 8, "#f0d84a");                       // plate
  ctx.fillStyle="#20242c"; ctx.font="bold 6px ui-monospace, monospace";
  ctx.textAlign="center"; ctx.textBaseline="top";
  ctx.fillText("SECA 900", cx, cy-3);

  // left-hand drive: you are on the left, Kalinka rides on the right
  const gy = cy-h-3, lean = -state.lean*9;
  ctx.fillStyle="#c8a074"; ctx.fillRect(cx-w*0.26+t+lean, gy, 8, 9);
  ctx.fillStyle="#3a2a1e"; ctx.fillRect(cx-w*0.26+t+lean, gy, 8, 3);
  /* Kalinka is turned round, watching the road behind. That was already the
     intent, but two black pixels on a plain block is not a face; she now has
     a muzzle and a nose so it reads as a dog rather than a smudge. */
  const kx = cx+w*0.13+t+lean, ky = gy+1;
  ctx.fillStyle="#e09a4a"; ctx.fillRect(kx, ky, 8, 8);
  ctx.fillStyle="#c47a34";
  ctx.fillRect(kx,   ky-2, 2, 3);                     // ears
  ctx.fillRect(kx+6, ky-2, 2, 3);
  ctx.fillRect(kx, ky, 8, 2);                         // darker crown
  ctx.fillStyle="#fff2dc"; ctx.fillRect(kx+2, ky+4, 4, 4);   // muzzle
  ctx.fillStyle="#1a1208";
  ctx.fillRect(kx+1, ky+2, 2, 2);                     // eyes
  ctx.fillRect(kx+5, ky+2, 2, 2);
  ctx.fillRect(kx+3, ky+4, 2, 2);                     // nose
  ctx.fillStyle="rgba(255,255,255,0.85)";
  ctx.fillRect(kx+1, ky+2, 1, 1);
  ctx.fillRect(kx+5, ky+2, 1, 1);
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* The beam starts at the bumper and swings with the wheel. Before, it was
   anchored to the vanishing point of the furthest visible road segment,
   which is why it wandered off independently of where the car pointed. */
function drawHeadlights(horizon){
  const cx = VW/2, hy = clamp(horizon, 8, VH-70);
  const steer = clamp((input.left?-1:0)+(input.right?1:0), -1, 1);
  const swing = steer * 26 + state.playerX * -10;
  const bumper = VH - 30;
  const cone = () => { ctx.moveTo(cx-13, bumper); ctx.lineTo(cx+13, bumper);
    ctx.lineTo(cx+58+swing, hy+1); ctx.lineTo(cx-58+swing, hy+1); ctx.closePath(); };
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,VW,VH); cone();
  /* When the ambient light is already down, a 0.90 cone on top of it
     multiplies out to near black. Ease it off as the eclipse deepens. */
  ctx.fillStyle = "rgba(2,3,8,"+(0.90 - 0.56*clamp(state.eclipse,0,1)).toFixed(3)+")"; ctx.fill("evenodd");
  ctx.restore();
  ctx.globalCompositeOperation = "lighter";
  const g = ctx.createLinearGradient(0, bumper, 0, hy);
  g.addColorStop(0,   "rgba(255,238,200,0.30)");
  g.addColorStop(0.5, "rgba(255,226,170,0.14)");
  g.addColorStop(1,   "rgba(255,220,160,0)");
  ctx.save(); ctx.beginPath(); cone(); ctx.clip();
  ctx.fillStyle = g; ctx.fillRect(0, hy, VW, VH-hy);
  ctx.restore();
  ctx.globalCompositeOperation = "source-over";
}

/* Standing water, laid on the tarmac. Placed from the segment's own index so
   a puddle stays where it is in the world rather than crawling up the road at
   you, and grouped four segments at a time so it reads as a pool and not a
   stripe. Cosmetic: nothing here touches grip. */
function drawPuddle(s, p1, p2){
  const g = Math.floor(s.index / 4);
  if (hash1(g*3.13) > 0.30 * state.wet) return;
  const off = (hash1(g + 501.7)*2 - 1) * 0.72;
  const wf  = 0.16 + hash1(g + 902.3)*0.26;
  const a   = 0.34 * state.wet;
  quad(ctx, p1.x + p1.w*off*2, p1.y, p1.w*wf,
            p2.x + p2.w*off*2, p2.y, p2.w*wf,
       "rgba(146,186,224,"+a.toFixed(3)+")");
  // a brighter streak down the middle: the sky in the water
  quad(ctx, p1.x + p1.w*off*2, p1.y, p1.w*wf*0.34,
            p2.x + p2.w*off*2, p2.y, p2.w*wf*0.34,
       "rgba(226,240,255,"+(a*0.7).toFixed(3)+")");
}

function render(){
  const segs = state.segments;
  if (!segs.length) return;

  const baseIdx  = Math.floor(state.position/SEGLEN);
  const basePct  = (state.position % SEGLEN)/SEGLEN;
  const base     = segs[baseIdx] || segs[0];
  const pSegIdx  = Math.floor((state.position+PLAYER_Z)/SEGLEN);
  const pSeg     = segs[Math.min(pSegIdx, segs.length-1)];
  const pPct     = ((state.position+PLAYER_Z) % SEGLEN)/SEGLEN;
  const playerY  = lerp(pSeg.p1.world.y, pSeg.p2.world.y, pPct);

  ctx.fillStyle = pal("ground",1); ctx.fillRect(0,0,VW,VH);

  let x = 0, dx = -(base.curve * basePct), maxy = VH;
  const camX = state.playerX * ROAD_W, camY = playerY + CAM_HEIGHT, camZ = state.position;
  const drawn = [];

  // first pass: project + draw the road, back to front is handled by maxy clipping
  for (let n=0; n<DRAW_DIST; n++){
    const s = segs[baseIdx + n];
    if (!s) break;
    project(s.p1, camX - x,      camY, camZ);
    project(s.p2, camX - x - dx, camY, camZ);
    x += dx; dx += s.curve;
    s.clip = maxy;
    if (s.p1.camera.z <= CAM_DEPTH || s.p2.screen.y >= s.p1.screen.y || s.p2.screen.y >= maxy) continue;
    drawn.push(s);
    maxy = s.p2.screen.y;
  }

  const horizon = maxy;
  // sky is painted behind everything, so re-fill above the horizon
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,VW,Math.max(0,horizon)); ctx.clip();
  drawSky(horizon);
  drawMountains(horizon, state.position*0.01 + state.playerX*-40);
  drawCity(horizon, state.position*0.01 + state.playerX*-40);
  ctx.restore();

  // now the road itself
  for (let i=drawn.length-1; i>=0; i--){
    const s = drawn[i];
    const dark = s.colour === "dark";
    // the kerb keeps its red and white; the ground and tarmac only hint at it
    const gcol = dark ? shade(pal("ground",1), BAND_GROUND) : pal("ground",0);
    const dcol = dark ? shade(pal("road",1),   BAND_ROAD)   : pal("road",0);
    const rcol = pal("rumble", dark?1:0);
    const p1 = s.p1.screen, p2 = s.p2.screen;
    ctx.fillStyle = gcol; ctx.fillRect(0, p2.y, VW, p1.y - p2.y + 1);
    quad(ctx, p1.x, p1.y, p1.w*1.24, p2.x, p2.y, p2.w*1.24, rcol);
    quad(ctx, p1.x, p1.y, p1.w,      p2.x, p2.y, p2.w,      dcol);
    if (s.dash){
      const lw1 = p1.w/22, lw2 = p2.w/22;
      for (const lane of [-0.34, 0.34]){
        quad(ctx, p1.x + p1.w*lane*2, p1.y, lw1,
                  p2.x + p2.w*lane*2, p2.y, lw2, pal("lane"));
      }
    }
    if (state.wet > 0.02) drawPuddle(s, p1, p2);
  }

  /* Distance haze. The road used to run to a hard edge at the horizon with
     every band still at full strength, which flattened the picture and made
     the furthest stripes the busiest thing on screen. A short fade into the
     sky colour gives the far end somewhere to go. */
  if (horizon > 0 && horizon < VH){
    const hz = Math.min(34, VH*0.11);
    const hg = ctx.createLinearGradient(0, horizon, 0, horizon + hz);
    const hc = pal("haze");
    hg.addColorStop(0, rgba(hc, 0.72));
    hg.addColorStop(1, rgba(hc, 0));
    ctx.fillStyle = hg;
    ctx.fillRect(0, horizon, VW, hz);
  }

  /* sprites, far to near */
  const bucket = new Map();
  const put = (z, item) => {
    const n = Math.floor(z/SEGLEN) - baseIdx;
    if (n < 1 || n >= DRAW_DIST) return;
    if (!bucket.has(n)) bucket.set(n, []);
    bucket.get(n).push(item);
  };
  for (const o of state.scenery) put(o.z, {k:"o", o});
  for (const c of state.traffic) put(c.z, {k:"c", c});

  for (let n=DRAW_DIST-1; n>0; n--){
    const items = bucket.get(n); if (!items) continue;
    const s = segs[baseIdx + n]; if (!s || !s.p1.screen.scale) continue;
    const sc = s.p1.screen.scale, sx = s.p1.screen.x, sy = s.p1.screen.y;
    if (sy > VH + 220) continue;
    for (const it of items){
      const off = it.k==="o" ? it.o.offset : it.c.offset;
      const px = sx + sc * off * ROAD_W * VW/2;
      if (it.k==="o") drawObj(it.o, px, sy, sc, s.clip);
      else            drawCar(it.c, px, sy, sc, s.clip);
    }
  }

  if (state.finishAt) drawFinishLine(segs, baseIdx);
  if (state.night) drawHeadlights(horizon);
  drawTyreSmoke();
  drawPlayerCar();

  /* beat flashes */
  if (state.snareFlash > 0.02){
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle = "rgba(255,235,200,"+(state.snareFlash*0.055).toFixed(3)+")";
    ctx.fillRect(0, Math.max(0,horizon-6), VW, 10);
    ctx.globalCompositeOperation="source-over";
  }
  if (state.hitFlash > 0.02){
    ctx.fillStyle = "rgba(255,70,40,"+(state.hitFlash*0.30).toFixed(3)+")";
    ctx.fillRect(0,0,VW,VH);
  }
  if (state.checkpointFlash > 0.02){
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle = "rgba(180,255,220,"+(state.checkpointFlash*0.12).toFixed(3)+")";
    ctx.fillRect(0,0,VW,VH);
    ctx.globalCompositeOperation="source-over";
  }

  weatherPass(horizon);
  drawHUD();
}

/* Rain, mist, the light level and the eclipse, over the finished frame. */
function weatherPass(horizon){
  if (state.rain > 0.02){
    if (!state.rainDrops.length)
      for (let i=0;i<80;i++) state.rainDrops.push({x:Math.random()*VW, y:Math.random()*VH,
        v:rnd(320,620), l:rnd(5,13), s:rnd(-0.5,0.5)});
    ctx.strokeStyle = "rgba(196,220,240,"+(0.5*state.rain).toFixed(2)+")";
    ctx.lineWidth = 1; ctx.beginPath();
    for (const d of state.rainDrops){
      d.y += d.v*0.016; d.x += d.s;
      if (d.y > VH){ d.y = -8; d.x = Math.random()*VW; }
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + d.s*2, d.y + d.l);
    }
    ctx.stroke();
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle="rgba(150,180,220,"+(0.05*state.rain).toFixed(3)+")";
    ctx.fillRect(0, Math.max(0,horizon), VW, VH-horizon);
    ctx.globalCompositeOperation="source-over";
  }

  // cool morning cast on the ground only; the sunrise above stays vivid
  if (state.chill > 0.02){
    ctx.globalCompositeOperation = "multiply";
    ctx.fillStyle = "rgba(168,192,236,"+(state.chill*0.62).toFixed(3)+")";
    ctx.fillRect(0, Math.max(0,horizon), VW, VH);
    ctx.globalCompositeOperation = "source-over";
  }

  /* the sky flickering between strikes: no fork, just the room lighting up */
  if (state.flashT > 0){
    ctx.fillStyle = "rgba(206,224,255,"+((state.flashT/0.18)*0.17).toFixed(3)+")";
    ctx.fillRect(0,0,VW,VH);
  }

  /* the strike itself: a white flash, the fork, a beat of dark, one more
     flicker of the fork as it dies */
  if (state.bolt && state.boltT > 0){
    const b = state.boltT;
    if (b > 0.40){
      ctx.fillStyle = "rgba(230,240,255,"+(((b-0.40)/0.14)*0.70).toFixed(3)+")";
      ctx.fillRect(0,0,VW,VH);
    }
    if (b > 0.30 || (b > 0.13 && b < 0.20)){
      ctx.strokeStyle = "rgba(176,212,255,0.50)"; ctx.lineWidth = 6;
      ctx.beginPath();
      for (const s of state.bolt) if (s[4] === 2){ ctx.moveTo(s[0],s[1]); ctx.lineTo(s[2],s[3]); }
      ctx.stroke();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
      ctx.beginPath();
      for (const s of state.bolt){ ctx.moveTo(s[0],s[1]); ctx.lineTo(s[2],s[3]); }
      ctx.stroke();
    }
  }

  // the light level
  if (state.light < 1){
    ctx.fillStyle = "rgba(4,6,16,"+((1-state.light)*0.74).toFixed(3)+")";
    ctx.fillRect(0,0,VW,VH);
  } else if (state.light > 1){
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle = "rgba(255,244,214,"+((state.light-1)*1.6).toFixed(3)+")";
    ctx.fillRect(0,0,VW,VH);
    ctx.globalCompositeOperation="source-over";
  }

  /* THE ECLIPSE, drawn last so nothing dims it. As the moon closes in
     the light drains, the stars come out and the whole horizon goes
     sunset-coloured in every direction, which is what actually happens
     and is the strangest part of standing under one. */
  const e = state.eclipse;
  if (e > 0.55){
    const t = clamp((e-0.55)/0.45, 0, 1);
    const cx = Math.round(VW/2 + state.playerX*-14);
    const cy = Math.round(clamp(horizon,40,VH) - keyed(SUN_H, state.bar));
    const now = state.musicT;

    // 360-degree horizon glow: the warmth, low down, where it belongs
    ctx.globalCompositeOperation="lighter";
    const hg = ctx.createLinearGradient(0, Math.max(0,horizon-30), 0, Math.max(0,horizon)+4);
    hg.addColorStop(0,"rgba(255,120,50,0)");
    hg.addColorStop(1,"rgba(255,146,66,"+(0.38*t).toFixed(3)+")");
    ctx.fillStyle=hg; ctx.fillRect(0, Math.max(0,horizon-30), VW, 34);

    // stars, bright enough to read through the dark, and only above the ridge
    const ridge = state.ridge;
    const ridgeAt = x => {
      if (!ridge || !ridge.length) return horizon;
      const i = clamp(Math.round((x + 20)/4), 0, ridge.length-1);
      return ridge[i][1];
    };
    for (const st of state.stars){
      const y = st.y*Math.max(1,horizon);
      const sx0 = Math.round(st.x*VW);
      if (y > ridgeAt(sx0) - 2) continue;
      const tw = 0.65 + 0.35*Math.sin(now*3.4 + st.b*30);
      ctx.fillStyle = "rgba(255,253,244,"+(t*st.b*tw).toFixed(3)+")";
      ctx.fillRect(sx0, Math.round(y), 1, 1);
      if (st.b > 0.86){
        ctx.fillStyle = "rgba(255,253,244,"+(t*0.5*tw).toFixed(3)+")";
        ctx.fillRect(sx0-1, Math.round(y), 3, 1);
        ctx.fillRect(sx0, Math.round(y)-1, 1, 3);
      }
    }

    if (e > 0.985){
      const f = clamp((e-0.985)/0.015, 0, 1);
      /* Everything bright is clipped to the sky. Before, the corona was a
         66px floodlight in additive mode reaching well past the horizon,
         which washed the tarmac out and left nothing to drive on. */
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, VW, Math.max(0, horizon-1)); ctx.clip();
      // corona rays, slowly turning, short and soft
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(now*0.06);
      for (let i=0;i<18;i++){
        const a0 = i/18*Math.PI*2;
        const len = 26 + 16*Math.abs(Math.sin(i*2.3)) + 3*Math.sin(now*1.6+i);
        ctx.beginPath();
        ctx.moveTo(Math.cos(a0-0.045)*22, Math.sin(a0-0.045)*22);
        ctx.lineTo(Math.cos(a0)*len,      Math.sin(a0)*len);
        ctx.lineTo(Math.cos(a0+0.045)*22, Math.sin(a0+0.045)*22);
        ctx.closePath();
        ctx.fillStyle="rgba(255,238,206,"+(0.15*f).toFixed(3)+")"; ctx.fill();
      }
      ctx.restore();
      // the corona: a tight warm halo rather than a light source
      const cg = ctx.createRadialGradient(cx,cy,19, cx,cy,44);
      cg.addColorStop(0,   "rgba(255,246,222,"+(0.52*f).toFixed(3)+")");
      cg.addColorStop(0.40,"rgba(255,196,132,"+(0.22*f).toFixed(3)+")");
      cg.addColorStop(1,   "rgba(255,140,60,0)");
      ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(cx,cy,44,0,7); ctx.fill();
      ctx.restore();
      ctx.globalCompositeOperation="source-over";
      // the moon
      ctx.fillStyle="#07030e"; ctx.beginPath(); ctx.arc(cx,cy,22,0,7); ctx.fill();
      ctx.strokeStyle="rgba(255,250,235,"+(0.95*f).toFixed(2)+")"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(cx,cy,23,0,7); ctx.stroke();
      /* Baily's beads: the last light going in, the first light coming
         out. The moon crosses left to right, so they sit on the right
         edge before totality and the left edge after it. The old test
         was against eclipse < 1, which is never false, so they always
         came out on the same side. */
      if (f < 0.75){
        const bead = 1-f;
        const side = state.moonX < 0 ? 0 : Math.PI;
        for (let i=0;i<5;i++){
          const a0 = -0.5 + i*0.25 + side;
          ctx.fillStyle="rgba(255,255,240,"+(bead*0.9).toFixed(2)+")";
          ctx.fillRect(cx+Math.cos(a0)*23-1, cy+Math.sin(a0)*23-1, 3, 3);
        }
      }
    } else {
      ctx.globalCompositeOperation="source-over";
    }
    ctx.globalCompositeOperation="source-over";
  }
}

/* ---- HUD ------------------------------------------------------- */
const FACE_MONO    = "bold %px ui-monospace, Menlo, monospace";
const FACE_DISPLAY = '%px "LagunaPump", "Arial Black", Impact, sans-serif';
let   TXT_FACE     = FACE_MONO;
function txt(s, x, y, col, size, align, shadow){
  ctx.font = TXT_FACE.replace("%", (size||8));
  ctx.textAlign = align||"left"; ctx.textBaseline="top";
  if (shadow !== false){ ctx.fillStyle="rgba(0,0,0,.75)"; ctx.fillText(s, x+1, y+1); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function drawHUD(){
  txt("TIME",  6, 5, "#ff8a3c", 8);
  txt(Math.ceil(state.timeLeft).toString().padStart(2,"0"), 6, 14,
      state.timeLeft<10?"#ff5a3c":"#ffe066", 13);

  /* TIME ADDED sits centred in the sky. It used to hang off the left edge
     under the clock, where it covered the road on a left-hand bend. */
  if (state.timeAdd > 0){
    const k = 1 - clamp(state.timeAdd/2.2, 0, 1);
    ctx.globalAlpha = clamp(state.timeAdd/0.5, 0, 1);
    txt("+"+state.timeAddV+"s",  VW/2, 50 - k*7, "#7cff9a", 14, "center");
    txt("TIME ADDED",            VW/2, 68 - k*7, "#7cff9a",  7, "center");
    ctx.globalAlpha = 1;
  }

  // score, right aligned against the edge
  txt("SCORE", VW-6, 5, "#ff6ad0", 8, "right");
  txt(Math.floor(state.score).toLocaleString("en-GB"), VW-6, 14, "#f4f0e4", 13, "right");

  // the chain, as a row of rungs under the score, each rung its own heat
  const rungs = Math.min(state.chain, CHAIN_CAP+1);
  /* The rungs drain from the left as the hold runs down. The chain lapses on
     its own after CHAIN_HOLD without a pass, which felt like it broke for no
     reason when there was nothing on screen saying so. */
  const held = state.chain ? clamp(state.chainT / CHAIN_HOLD, 0, 1) : 0;
  for (let i=0;i<CHAIN_CAP+1;i++){
    const on = i < rungs;
    const spent = on && (i+1) > Math.ceil(rungs * held);
    ctx.fillStyle = !on ? "rgba(255,255,255,.13)"
                  : spent ? "rgba(255,255,255,.22)" : chainColour(i+1);
    ctx.fillRect(VW-6-(CHAIN_CAP-i)*8 - 6, 31, 6, 4);
  }
  if (state.chain > 1) txt("x"+state.chain, VW-6, 38, chainColour(state.chain), 9, "right");

  /* OutRun topped out at 293 km/h and that is the number people remember, so
     the dial is scaled to reach it at full throttle rather than running on to
     an arcade-implausible 400. */
  const kph = Math.round(state.speed / (BASE_SPEED*THROTTLE_MAX) * 293);
  txt(kph+" km/h", 6, VH-20, "#ffe066", 9);
  const bars = 12, lit = Math.round(clamp((state.throttle-THROTTLE_MIN)/(THROTTLE_MAX-THROTTLE_MIN),0,1)*bars);
  for (let i=0;i<bars;i++){
    ctx.fillStyle = i<lit ? (i>bars-4?"#ff5a3c":"#7ad0ff") : "rgba(255,255,255,.14)";
    ctx.fillRect(6+i*7, VH-8, 5, 4);
  }

  if (state.pop){
    // sits just above the roof, out of the road, in the chain's own colour
    const k = 1 - clamp(state.pop.t/0.9, 0, 1);
    ctx.globalAlpha = clamp(state.pop.t/0.35, 0, 1);
