    // always green: red hanging over your own roof reads as a warning
    txt("+"+state.pop.v, VW/2, VH-72 - k*10, "#7cff9a", 10, "center");
    ctx.globalAlpha = 1;
  }
}

/* The Nova head on, for the title screen. Lofi arcade: flat colour, hard
   black edges, lamps lit. Mike driving on the left, Kalinka riding. */
function drawNovaFront(cx, cy, sc){
  const W = 62*sc, H = 40*sc;
  const R = (x,y,w,h,f)=>{ ctx.fillStyle=f; ctx.fillRect(cx+x*sc, cy+y*sc, w*sc, h*sc);
    ctx.strokeRect(cx+x*sc, cy+y*sc, w*sc, h*sc); };
  ctx.strokeStyle="#000"; ctx.lineWidth=Math.max(1.5, 2*sc);
  ctx.lineJoin="round";

  // headlamp spill on the ground
  ctx.globalCompositeOperation="lighter";
  for (const side of [-1,1]){
    const g = ctx.createRadialGradient(cx+side*20*sc, cy+2*sc, 2*sc, cx+side*20*sc, cy+2*sc, 44*sc);
    g.addColorStop(0,"rgba(255,244,206,0.55)"); g.addColorStop(1,"rgba(255,230,170,0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx+side*20*sc, cy+6*sc, 44*sc, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation="source-over";

  ctx.fillStyle="rgba(0,0,0,.45)";
  ctx.beginPath(); ctx.ellipse(cx, cy+30*sc, 34*sc, 5*sc, 0, 0, 7); ctx.fill();

  // wheels peeking
  R(-33,  14, 6, 12, "#141418");
  R( 27,  14, 6, 12, "#141418");
  // roof spoiler ears
  R(-34, -34, 9, 4, "#15151a");
  R( 25, -34, 9, 4, "#15151a");
  // roof and screen surround
  R(-27, -37, 54, 6, "#a81c14");
  // windscreen
  R(-26, -31, 52, 17, "#16273f");
  ctx.fillStyle="#2c4a76"; ctx.fillRect(cx-24*sc, cy-29*sc, 48*sc, 6*sc);
  // wiper
  ctx.strokeStyle="#0c0c10"; ctx.lineWidth=Math.max(1,1.4*sc);
  ctx.beginPath(); ctx.moveTo(cx-16*sc, cy-15*sc); ctx.lineTo(cx-2*sc, cy-22*sc); ctx.stroke();
  ctx.strokeStyle="#000"; ctx.lineWidth=Math.max(1.5, 2*sc);

  // Mike, left-hand drive, so on the right as we look at the front
  const mx = 6;
  ctx.fillStyle="#d8a97e"; ctx.fillRect(cx+mx*sc, cy-27*sc, 13*sc, 11*sc);
  ctx.fillStyle="#15151a"; ctx.fillRect(cx+(mx-1)*sc, cy-30*sc, 15*sc, 5*sc);
  ctx.fillRect(cx+(mx-4)*sc, cy-26*sc, 5*sc, 2*sc);          // peak
  ctx.fillStyle="#2f7ad0"; ctx.fillRect(cx+(mx+2)*sc, cy-23*sc, 3*sc, 3*sc);
  ctx.fillRect(cx+(mx+8)*sc, cy-23*sc, 3*sc, 3*sc);
  ctx.fillStyle="#0a0a0e"; ctx.fillRect(cx+(mx+3)*sc, cy-22*sc, 1*sc, 1*sc);
  ctx.fillRect(cx+(mx+9)*sc, cy-22*sc, 1*sc, 1*sc);
  ctx.fillStyle="#9c7050"; ctx.fillRect(cx+(mx+4)*sc, cy-18*sc, 5*sc, 1*sc);

  // Kalinka, riding, on the left as we look at it
  const kx = -19;
  ctx.fillStyle="#e09a4a"; ctx.fillRect(cx+kx*sc, cy-26*sc, 13*sc, 11*sc);
  ctx.fillStyle="#c47a34";
  ctx.fillRect(cx+kx*sc, cy-31*sc, 4*sc, 6*sc);
  ctx.fillRect(cx+(kx+9)*sc, cy-31*sc, 4*sc, 6*sc);
  ctx.fillStyle="#fff2dc"; ctx.fillRect(cx+(kx+3)*sc, cy-20*sc, 7*sc, 5*sc);
  ctx.fillStyle="#0a0a0e";
  ctx.fillRect(cx+(kx+2)*sc, cy-23*sc, 2*sc, 2*sc);
  ctx.fillRect(cx+(kx+9)*sc, cy-23*sc, 2*sc, 2*sc);
  ctx.fillRect(cx+(kx+5)*sc, cy-19*sc, 3*sc, 2*sc);

  // bonnet, body, bumper
  R(-31, -14, 62, 12, "#c4241a");
  ctx.fillStyle="#e8412c"; ctx.fillRect(cx-28*sc, cy-12*sc, 56*sc, 4*sc);
  R(-33,  -2, 66, 12, "#b81f16");
  R(-33,  10, 66,  7, "#8f1710");

  // lamps
  R(-30, -12, 15, 9, "#fff6cc");
  R( 15, -12, 15, 9, "#fff6cc");
  ctx.fillStyle="#ffd24a";
  ctx.fillRect(cx-28*sc, cy-10*sc, 11*sc, 5*sc);
  ctx.fillRect(cx+17*sc, cy-10*sc, 11*sc, 5*sc);
  // grille and badge
  R(-13, -12, 26, 9, "#1a1a1e");
  ctx.fillStyle="#4a4a50";
  for (let i=0;i<3;i++) ctx.fillRect(cx-11*sc, cy-(11-i*3)*sc, 22*sc, 1*sc);
  ctx.fillStyle="#e8e2d0"; ctx.font="bold "+Math.round(5*sc)+"px ui-monospace, monospace";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("GSi", cx, cy-7.5*sc);
  // intake and plate
  R(-16,  11, 32,  5, "#101014");
  R(-15,  -1, 30,  8, "#f4f2ea");
  ctx.fillStyle="#15151a"; ctx.font="bold "+Math.round(6*sc)+"px ui-monospace, monospace";
  ctx.fillText("SECA 900", cx, cy+3*sc);
  ctx.textBaseline="top";
}

function drawOverlayScreen(){
  TXT_FACE = FACE_DISPLAY;
  ctx.fillStyle="#0a0810"; ctx.fillRect(0,0,VW,VH);
  const t = performance.now()/1000;
  for (const s of state.stars){
    ctx.fillStyle="rgba(255,245,225,"+(0.25+0.5*s.b*(0.5+0.5*Math.sin(t*2+s.b*20))).toFixed(3)+")";
    ctx.fillRect(Math.round(s.x*VW), Math.round(s.y*VH*1.6), 1, 1);
  }
  if (state.mode==="title"){
    txt("LIEBEZEIT", VW/2, 26, "#ff6ad0", 21, "center");
    txt("TRAFFIC DODGER", VW/2, 58, "#ffc46a", 11, "center");
    drawNovaFront(VW/2, 176, 1.35);
    if ((t%1)<0.6) txt("PRESS SPACE OR TAP", VW/2, 244, "#f4f0e4", 11, "center");
    txt("EACH CLEAN PASS PAYS MORE", VW/2, VH-42, "#6a6458", 7, "center");
    txt(VERSION, VW/2, VH-25, "#8a8478", 8, "center");
  } else {
    txt(state.mode==="over" ? "TIME UP" : "FINISH", VW/2, 58, "#ffe066", 24, "center");
    txt("BEST CHAIN x"+state.bestChain, VW/2, 96, "#ff6ad0", 10, "center");
    txt("SCORE "+Math.floor(state.score).toLocaleString("en-GB"), VW/2, 116, "#f4f0e4", 13, "center");
    if ((t%1)<0.6) txt("SPACE / TAP TO GO AGAIN", VW/2, 152, "#7ad0ff", 10, "center");
  }
  TXT_FACE = FACE_MONO;
}

/* The pause card: the frame you were on, dimmed, with the word over it. */
function drawPaused(){
  ctx.fillStyle = "rgba(6,4,12,0.62)"; ctx.fillRect(0,0,VW,VH);
  TXT_FACE = FACE_DISPLAY;
  txt("PAUSED", VW/2, VH/2 - 32, "#ffe066", 23, "center");
  txt("TAP ANYWHERE TO CARRY ON", VW/2, VH/2 + 4, "#f4f0e4", 8, "center");
  /* The three keyboard extras have nowhere else to be announced. Mono, not
     the display face: LagunaPump is wide and this line ran off both edges.
     The last word is the state the sound is in, not what the key does. */
  TXT_FACE = FACE_MONO;
  txt("R RETRY \u00b7 S SOUND", VW/2, VH/2 + 22, "#b7ae9c", 7, "center");
  TXT_FACE = FACE_DISPLAY;
  const b = PAUSE_RETRY;
  ctx.fillStyle = "#c4241a"; ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeStyle = "#f4f0e4"; ctx.lineWidth = 2;
  ctx.strokeRect(b.x+1, b.y+1, b.w-2, b.h-2);
  txt("RETRY", VW/2, b.y + 7, "#fff4e2", 11, "center");
  /* The sound box is outlined rather than filled, so it reads as the lesser
     of the two and nobody stabs it looking for RETRY. */
  const q = PAUSE_SFX;
  ctx.fillStyle = "rgba(20,16,12,0.55)"; ctx.fillRect(q.x, q.y, q.w, q.h);
  ctx.strokeStyle = Sfx.muted ? "#b7ae9c" : "#7cff9a"; ctx.lineWidth = 2;
  ctx.strokeRect(q.x+1, q.y+1, q.w-2, q.h-2);
  txt(Sfx.muted ? "SFX OFF" : "SFX ON", VW/2, q.y + 6,
      Sfx.muted ? "#b7ae9c" : "#7cff9a", 10, "center");
  TXT_FACE = FACE_MONO;
}

/* ---- present -----------------------------------------------------
   Everything is drawn at 224x320 and upscaled once. There was a CRT pass
   here: scanlines, an aperture grille, a vignette, a static chromatic
   split. It was well behaved and it added nothing. What carries speed on
   this game is the banding on the tarmac, not a mask over the top of it,
   and the mask was quietly costing a tenth of the picture's brightness
   for the privilege. Gone, and with it the bloom canvas it fed on. */
function present(){
  octx.imageSmoothingEnabled = false;
  octx.drawImage(buf, 0, 0, out.width, out.height);
}

/* ============================================================
   INPUT
   ============================================================ */
const input = { left:false, right:false, up:false, down:false };
const keymap = {
  ArrowLeft:"left", a:"left", A:"left",
  ArrowRight:"right", d:"right", D:"right",
  ArrowUp:"up", w:"up", W:"up",
  ArrowDown:"down"
};
/* S used to be the brake in the undocumented WASD scheme. It is the sound
   toggle now, and it cannot be both: braking would have cut the effects. The
   arrows and the four pads are what the cabinet actually advertises. */
addEventListener("keydown", e=>{
  if (keymap[e.key]){ input[keymap[e.key]] = true; e.preventDefault(); }
  if (e.key === " "){ e.preventDefault(); if (!togglePause()) advance(); }
  if (e.key === "r" || e.key === "R"){ e.preventDefault(); retry(); }
  if (e.key === "s" || e.key === "S"){ Sfx.mute(!Sfx.muted); state.sfxMsg = 1.4; }
  if (e.key === "m" || e.key === "M") Audio8.clickOn = !Audio8.clickOn;
});
addEventListener("keyup", e=>{ if (keymap[e.key]){ input[keymap[e.key]] = false; e.preventDefault(); } });

/* Space on a keyboard, a tap on the screen with a thumb. Only during a run;
   on the title and end screens those same inputs start the next one. */
function togglePause(){
  if (state.mode !== "play") return false;
  state.paused = !state.paused;
  if (state.paused) Audio8.hold(); else Audio8.letGo();
  return true;
}

/* Start again from wherever you are: mid-run, paused, or on an end screen. */
function retry(){
  if (state.mode === "title"){ advance(); return; }
  state.paused = false;
  Audio8.letGo();
  Sfx.silence();
  if (typeof LEADERBOARD_ENABLED !== "undefined" && LEADERBOARD_ENABLED && window.Leaderboard)
    { Leaderboard.hideScreen(); Leaderboard.onGameStart(); }
  Audio8.init();
  startRun();
}

/* The retry button on the pause card, in buffer coordinates. Touch has no
   keyboard, so pausing is how a phone gets at it: the card is the menu. */
const PAUSE_RETRY = { x: VW/2 - 42, y: VH/2 + 44, w: 84, h: 24 };
/* A phone has no S key, so the sound toggle has to be a box you can hit.
   It sits under RETRY on the same card. */
const PAUSE_SFX   = { x: VW/2 - 42, y: VH/2 + 74, w: 84, h: 22 };

function advance(){
  if (state.mode === "play") return;
  Audio8.init();
  startRun();
}
/* The screen itself is no longer a control. Steering by where your thumb
   landed on the glass was always a worse version of the pads, and it meant
   a stray touch mid-corner threw the car. A tap on the screen pauses. */
function pointer(e, down){
  e.preventDefault();
  if (!down) return;
  if (state.mode !== "play"){ advance(); return; }
  /* While paused the screen is a two-button menu: the RETRY box starts again,
     anywhere else carries on. It has to be hit deliberately, because a stray
     tap that threw away a good run would be unforgivable. */
  if (state.paused){
    const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    const r = out.getBoundingClientRect();
    const bx = (t.clientX - r.left) / r.width  * VW;
    const by = (t.clientY - r.top)  / r.height * VH;
    const inBox = b => bx >= b.x && bx <= b.x + b.w && by >= b.y && by <= b.y + b.h;
    if (inBox(PAUSE_RETRY)){ retry(); return; }
    /* Toggling sound must not also unpause, or you would never see what you
       just did to it. */
    if (inBox(PAUSE_SFX)){ Sfx.mute(!Sfx.muted); return; }
  }
  togglePause();
}
out.addEventListener("touchstart", e=>pointer(e,true), {passive:false});
out.addEventListener("touchend",   e=>pointer(e,false),{passive:false});
out.addEventListener("mousedown",  e=>pointer(e,true));
addEventListener("mouseup",        e=>pointer(e,false));

/* ============================================================
   BOOT
   ============================================================ */
function resize(){
  const W = innerWidth, H = innerHeight - 22;
  const s = Math.max(1, Math.floor(Math.min(W/VW, H/VH) * 2) / 2);
  out.width  = Math.round(VW * s);
  out.height = Math.round(VH * s);
  out.style.width  = out.width + "px";
  out.style.height = out.height + "px";
}
addEventListener("resize", resize); resize();

/* start.wav is Mike's own car turning over, and it belongs to the title
   screen. No browser will make a sound before you have touched the page, so
   it goes off on the first real gesture: a click anywhere on the cabinet
   plays it in full, and if that gesture is the one that starts a run then
   startRun fades it out under the music, which turns it into an ignition. */
(function armIgnition(){
  const fire = () => {
    Audio8.init();
    if (Audio8.ctx.state === "suspended") Audio8.ctx.resume();
    if (state.mode === "title" && !state.startSrc) state.startSrc = Sfx.play("start", 0.5);
  };
  const once = () => { stop(); fire(); };
  const stop = () => { for (const e of ["pointerdown","keydown","touchstart"])
                         removeEventListener(e, once, true); };
  for (const e of ["pointerdown","keydown","touchstart"]) addEventListener(e, once, true);
  // if the browser already trusts this site, no gesture is needed
  try {
    Audio8.init();
    if (Audio8.ctx.state === "running") setTimeout(() => { stop(); fire(); }, 350);
  } catch(e){}
})();

/* Pull the face in before the first title frame, so the wordmark does not
   flash up in Arial Black and then swap. */
if (document.fonts && document.fonts.load) document.fonts.load('24px "LagunaPump"').catch(()=>{});

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  /* The rAF call used to sit after the work, so any throw inside a frame
     killed the loop dead and froze the picture. Twice now that has cost a
     playthrough: once an undefined palette stop, once a leaderboard method
     that did not exist. The loop keeps going and complains once instead. */
  try {
    update(dt);
    if (state.mode === "play") render(); else { drawOverlayScreen(); }
    if (state.paused) drawPaused();
    /* The sound toast lives out here rather than in update(), because update()
       returns early while paused and S works whether you are paused or not. */
    if (state.sfxMsg > 0){
      state.sfxMsg -= dt;
      TXT_FACE = FACE_DISPLAY;
      ctx.globalAlpha = clamp(state.sfxMsg/0.4, 0, 1);
      /* Up in the sky with TIME ADDED rather than down by the car, where it
         sat on the roof and you could not read either. */
      txt(Sfx.muted ? "SOUND FX OFF" : "SOUND FX ON", VW/2, 96,
          Sfx.muted ? "#ffc46a" : "#7cff9a", 11, "center");
      ctx.globalAlpha = 1;
      TXT_FACE = FACE_MONO;
    }
    present();
  } catch (err) {
    if (!state.errLogged){ state.errLogged = true; console.error("[liebezeit] frame error", err); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
