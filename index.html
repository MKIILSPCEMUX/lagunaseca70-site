<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Laguna Seca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Laguna Seca" />
  <meta property="og:description" content="A little arcade by Laguna Seca. Play The Dark Star and Laguna Sneca, two mini games locked to the beat." />
  <meta property="og:url" content="https://lagunaseca70.com/" />
  <meta property="og:image" content="https://lagunaseca70.com/social-preview.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Laguna Seca" />
  <meta name="twitter:description" content="A little arcade by Laguna Seca. Play The Dark Star and Laguna Sneca, two mini games locked to the beat." />
  <meta name="twitter:image" content="https://lagunaseca70.com/social-preview.jpg" />

  <style>
    :root {
      --space: #06080d;
      --ink: #e9e7e0;
      --dim: rgba(233, 231, 224, 0.6);
      --green: #48d86b;
      --pink: #ff3a7f;
      --purple: #2a1147;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      background: var(--space);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      overflow-x: hidden;
    }
    .background {
      position: fixed; inset: 0; z-index: -2;
      background: url("/darkstar/img/darkstar_flare_b.jpg") center center / cover no-repeat;
    }
    .background::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(6,8,13,0.55), rgba(6,8,13,0.9) 80%);
    }

    .wrap { width: 100%; max-width: 480px; margin: auto; }

    .head { text-align: center; margin-bottom: 26px; }
    .head h1 {
      font-size: clamp(30px, 9vw, 46px);
      font-weight: 800;
      letter-spacing: 0.14em;
      text-indent: 0.14em;
      text-transform: uppercase;
    }
    .head .tag {
      margin-top: 10px;
      font-size: 10px;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .cards { display: flex; flex-direction: column; gap: 16px; }

    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
      transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease, background 140ms ease;
    }
    .card:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.06); }

    .thumb {
      flex: 0 0 108px;
      width: 108px; height: 82px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      border: 2px solid #000;
    }
    .thumb img { width: 84%; image-rendering: pixelated; display: block; }

    .card-body { flex: 1; min-width: 0; }
    .card-name {
      font-size: 19px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase;
    }
    .card-tag { margin-top: 4px; font-size: 10.5px; letter-spacing: 0.08em; color: var(--dim); }
    .card-play {
      margin-top: 9px; font-size: 10px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase;
    }

    /* Dark Star card */
    .card.darkstar .thumb { background: linear-gradient(160deg, #0b2011, #04070c); }
    .card.darkstar:hover { border-color: rgba(72, 216, 107, 0.6); box-shadow: 0 14px 34px rgba(0,0,0,0.5), 0 0 22px rgba(72,216,107,0.22); }
    .card.darkstar .card-play { color: var(--green); }

    /* Sneca card */
    .card.sneca .thumb { background: radial-gradient(circle at top, #3a1c6f, #120320); }
    .card.sneca:hover { border-color: rgba(255, 58, 127, 0.6); box-shadow: 0 14px 34px rgba(0,0,0,0.5), 0 0 22px rgba(255,58,127,0.22); }
    .card.sneca .card-play { color: var(--pink); }

    .foot {
      margin-top: 28px; text-align: center;
      font-size: 10px; letter-spacing: 0.1em; color: var(--dim);
      line-height: 2;
    }
    .foot a { color: var(--ink); text-decoration: none; border-bottom: 1px solid rgba(233,231,224,0.25); padding-bottom: 1px; }
    .foot a:hover { border-color: var(--ink); }
    .foot .dot { opacity: 0.4; margin: 0 6px; }

    @media (max-width: 420px) {
      .thumb { flex-basis: 92px; width: 92px; height: 70px; }
      .card-name { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div class="background"></div>

  <div class="wrap">
    <div class="head">
      <h1>Laguna Seca</h1>
      <div class="tag">Mini-game arcade</div>
    </div>

    <div class="cards">
      <a class="card darkstar" href="/darkstar/">
        <div class="thumb"><img src="/darkstar/img/darkstar_title.png" alt="The Dark Star" /></div>
        <div class="card-body">
          <div class="card-name">The Dark Star</div>
          <div class="card-tag">Rhythm asteroids &middot; 135 BPM &middot; sound on</div>
          <div class="card-play">Play &#9654;</div>
        </div>
      </a>

      <a class="card sneca" href="/sneca/">
        <div class="thumb"><img src="/game/laguna-logo.png" alt="Laguna Sneca" /></div>
        <div class="card-body">
          <div class="card-name">Laguna Sneca</div>
          <div class="card-tag">Snake &middot; 105 BPM &middot; swipe or arrows</div>
          <div class="card-play">Play &#9654;</div>
        </div>
      </a>
    </div>

    <div class="foot">
      Music and games by Laguna Seca<br />
      <a href="https://lagunaseca.bandcamp.com/album/live-from-m-sli-mountain" target="_blank" rel="noopener noreferrer">Bandcamp</a>
      <span class="dot">&middot;</span>
      <a href="https://patreon.com/thenorthhouse" target="_blank" rel="noopener noreferrer">Patreon</a>
      <span class="dot">&middot;</span>
      <a href="https://buttondown.com/LagunaSeca70" target="_blank" rel="noopener noreferrer">Mailing list</a>
      <span class="dot">&middot;</span>
      <a href="mailto:contact@lagunaseca70.com">Contact</a>
    </div>
  </div>
</body>
</html>
