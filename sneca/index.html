<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Laguna Sneca</title>

  <!-- Mobile + scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/game/laguna-logo.png" />

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Laguna Seca" />
  <meta property="og:description" content="Music by Laguna Seca. Play Laguna Sneca, a snake game locked to the beat. New album O Tempo out this autumn on Throttle Records." />
  <meta property="og:url" content="https://lagunaseca70.com/sneca/" />
  <meta property="og:image" content="https://lagunaseca70.com/social-preview.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Laguna Seca" />
  <meta name="twitter:description" content="Music by Laguna Seca. Play Laguna Sneca, a snake game locked to the beat. New album O Tempo out this autumn on Throttle Records." />
  <meta name="twitter:image" content="https://lagunaseca70.com/social-preview.jpg" />

  <style>
    :root {
      --cabinet-purple: #210c3b;
      --button-blue: #13b0e5;
      --button-pink: #ff3a7f;
      --text-light: #ffffff;
      --link-pink: #ff62a5;
      --snake-body: #7cf35b;
      --food-color: #ff6b6b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }

    body {
      font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      background: #1a0b2e;
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* Disable page scroll during play so arrows do not scroll */
    body.playing { overflow: hidden; }

    .background {
      position: fixed;
      inset: 0;
      background: url("/game/background.jpg") center center / cover no-repeat;
      z-index: -1;
    }
    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(20,7,40,0.35), rgba(12,3,24,0.72) 82%);
    }

    .wrap {
      width: 100%;
      max-width: 430px;
      margin: auto;
      padding: 18px 10px 26px;
      display: flex;
      justify-content: center;
    }

    /* THE CABINET (Dark Star chrome, original purple colours) */
    .cabinet {
      position: relative;
      width: 100%;
      background: radial-gradient(circle at 50% 0%, #3a1c6f 0, var(--cabinet-purple) 46%, #120320 100%);
      border-radius: 20px 20px 26px 26px;
      padding: 20px 18px 16px;
      box-shadow:
        0 22px 50px rgba(0,0,0,0.72),
        inset 0 1px 0 rgba(255,255,255,0.14),
        inset 0 -3px 8px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    .cabinet::before {
      content: "";
      position: absolute;
      inset: 8px 8px 10px 8px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      pointer-events: none;
    }
    .screw {
      position: absolute;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #d3d3da, #6b6b73 60%, #33333a);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25);
    }
    .screw.tl { top: 14px; left: 14px; }
    .screw.tr { top: 14px; right: 14px; }
    .screw.bl { bottom: 16px; left: 14px; }
    .screw.br { bottom: 16px; right: 14px; }

    /* Header */
    .hull-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2px 6px 10px;
    }
    .logo {
      width: 78%;
      max-width: 300px;
      height: auto;
      display: block;
      image-rendering: pixelated;
      margin: 2px auto 0;
    }
    .hull-caption {
      margin-top: 10px;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(255,255,255,0.72);
      text-align: center;
    }

    /* SCREEN BEZEL */
    .bezel {
      background: linear-gradient(160deg, #1a0730, #0a0216);
      border-radius: 12px;
      padding: 12px;
      box-shadow:
        inset 0 2px 6px rgba(0,0,0,0.7),
        inset 0 0 0 1px rgba(255,255,255,0.06);
    }
    /* aspect-ratio matches the 19x34 canvas grid so it fills the width with no side gaps */
    .screen-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 19 / 34;
      max-height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      background: #000;
    }

    /* SWITCHES (Dark Star layout, original blue/pink colours) */
    .switches {
      display: flex;
      gap: 12px;
      margin: 14px 4px 8px;
    }
    .switch {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 10px;
      border-radius: 24px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #06121f;
      box-shadow: 0 6px 14px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
    }
    .switch.blue { background: var(--button-blue); }
    .switch.pink { background: var(--button-pink); color: #fff; }
    .switch:hover { transform: translateY(-1px); filter: brightness(1.04); }
    .switch:active { transform: translateY(1px); box-shadow: inset 0 2px 4px rgba(0,0,0,0.4); }
    .led { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.92); box-shadow: 0 0 6px rgba(255,255,255,0.85); }

    /* mailing list */
    .ds-signup { display: flex; gap: 8px; justify-content: center; margin: 4px 6px 6px; }
    .ds-signup input { flex: 1; max-width: 190px; height: 32px; padding: 5px 12px; border-radius: 16px; border: none; background: #fff; color: #210c3b; font-size: 12px; }
    .ds-signup button { height: 32px; padding: 5px 16px; border-radius: 16px; border: none; background: #fff; color: #210c3b; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; font-size: 11px; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.35); }
    .ds-signup button:hover { filter: brightness(0.94); }
    .ds-signup button:disabled { opacity: 0.6; cursor: default; }

    .newsletter-feedback {
      text-align: center;
      font-size: 10px;
      margin: 0 6px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: opacity 200ms ease-out, max-height 200ms ease-out;
      font-weight: 700;
    }
    .newsletter-feedback.visible { opacity: 1; max-height: 40px; margin-top: 4px; }
    #newsletter-success { color: var(--snake-body); }
    #newsletter-error { color: var(--food-color); }

    .hull-foot {
      text-align: center;
      font-size: 8.5px;
      line-height: 1.7;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.72);
      text-transform: uppercase;
      font-weight: 700;
      padding: 8px 4px 2px;
    }
    .hull-foot a { color: var(--link-pink); text-decoration: none; }

    @media (max-width: 480px) {
      .wrap { padding: 10px 6px 18px; }
      .cabinet { padding: 16px 13px 12px; }
    }
  </style>
</head>
<body>
  <div class="background"></div>

  <div class="wrap">
    <div class="cabinet">
      <span class="screw tl"></span><span class="screw tr"></span>
      <span class="screw bl"></span><span class="screw br"></span>

      <div class="hull-head">
        <img class="logo" src="/game/laguna-logo.png" alt="Laguna Sneca" />
        <div class="hull-caption">A mini game by Laguna Seca</div>
      </div>

      <div class="bezel">
        <div class="screen-viewport">
          <canvas id="gameCanvas"></canvas>
        </div>
      </div>

      <div class="switches">
        <a class="switch blue" href="https://lagunaseca.bandcamp.com/track/laguna-sneca" target="_blank" rel="noopener noreferrer">
          <span class="led"></span>Bandcamp
        </a>
        <a class="switch pink" href="/darkstar/">
          <span class="led"></span>The Dark Star
        </a>
      </div>

      <form
        id="newsletter-form"
        class="ds-signup"
        action="https://buttondown.com/api/emails/embed-subscribe/LagunaSeca70"
        method="post"
        target="popupwindow"
        onsubmit="window.open('https://buttondown.com/LagunaSeca70','popupwindow')"
      >
        <input id="newsletter-email" type="email" name="email" required placeholder="your@email.com" aria-label="Email" />
        <button type="submit">Join</button>
      </form>

      <div id="newsletter-success" class="newsletter-feedback">&#10004; Thanks for joining! Check your inbox to confirm.</div>
      <div id="newsletter-error" class="newsletter-feedback">Please enter a valid email address.</div>

      <div class="hull-foot">
        Laguna Sneca &middot; a beat-locked snake game, 105 BPM<br />
        Music and design by Laguna Seca &middot; <a href="mailto:contact@lagunaseca70.com">contact@lagunaseca70.com</a> &middot; <a href="https://buymeacoffee.com/mikejefford" target="_blank" rel="noopener noreferrer">Buy me a coffee</a>
      </div>
    </div>
  </div>

  <script>
    // -----------------------------
    // Core settings
    // -----------------------------
    const GRID_COLS = 19;
    const GRID_ROWS = 34;
    const CELL_SIZE = 24;
    const GAME_WIDTH = GRID_COLS * CELL_SIZE;
    const GAME_HEIGHT = GRID_ROWS * CELL_SIZE;
    const TICK_MS = 145;       // snappy, still in time with loop
    const START_DELAY_MS = 200;

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;

    ctx.lineJoin = "miter";
    ctx.lineCap = "square";

    function resizeCanvasDisplay() {
      const viewport = document.querySelector(".screen-viewport");
      if (!viewport) return;

      const maxWidth = viewport.clientWidth;
      const maxHeight = viewport.clientHeight;

      const scale = Math.min(
        maxWidth / GAME_WIDTH,
        maxHeight / GAME_HEIGHT
      );

      canvas.style.width = GAME_WIDTH * scale + "px";
      canvas.style.height = GAME_HEIGHT * scale + "px";
    }

    window.addEventListener("resize", resizeCanvasDisplay);
    window.addEventListener("orientationchange", resizeCanvasDisplay);
    resizeCanvasDisplay();

    // -----------------------------
    // Assets
    // -----------------------------
    const bgImage = new Image();
    bgImage.src = "/game/background.jpg";

    const logoImage = new Image();
    logoImage.src = "/game/laguna-logo.png";

    const deathImage = new Image();
    deathImage.src = "/game/you_died_from_hot_clean.png";

    const music = new Audio("/game/loop.mp3");
    music.loop = true;

    const deathSound = new Audio("/game/death.wav");

    bgImage.onload = () => {
      draw();
    };

    // -----------------------------
    // Game state
    // -----------------------------
    const DIRECTION = {
      LEFT:  { x: -1, y: 0 },
      RIGHT: { x:  1, y: 0 },
      UP:    { x:  0, y: -1 },
      DOWN:  { x:  0, y:  1 }
    };

    // Snake is HEAD-FIRST: snake[0] is head
    let snake;
    let direction;
    let pendingDirection;
    let food;
    let score;
    let gameState = "start"; // "start" | "playing" | "paused" | "dead"
    let lastTickTime = 0;
    let tickId = null;

    function resetGame() {
      const START_ROW = 15;
      const startX = Math.floor(GRID_COLS / 2) - 2;

      snake = [
        { x: startX + 0, y: START_ROW }, // head (leftmost)
        { x: startX + 1, y: START_ROW },
        { x: startX + 2, y: START_ROW },
        { x: startX + 3, y: START_ROW },
        { x: startX + 4, y: START_ROW }
      ];

      direction = DIRECTION.LEFT;
      pendingDirection = DIRECTION.LEFT;
      score = 0;
      placeFood();
    }

    function placeFood() {
      while (true) {
        const x = Math.floor(Math.random() * GRID_COLS);
        const y = Math.floor(Math.random() * GRID_ROWS);
        const onSnake = snake.some((seg) => seg.x === x && seg.y === y);
        if (!onSnake) {
          food = { x, y };
          return;
        }
      }
    }

    // -----------------------------
    // Input handling
    // -----------------------------
    function setDirectionFromKey(key) {
      if (key === " ") {
        if (gameState === "start") {
          startGame();
          return;
        }
        if (gameState === "dead") {
          restartAfterDeath();
          return;
        }
        if (gameState === "playing") {
          pauseGame();
          return;
        }
        if (gameState === "paused") {
          resumeGame();
          return;
        }
      }

      if (gameState !== "playing") return;

      if (key === "ArrowUp" && direction !== DIRECTION.DOWN) {
        pendingDirection = DIRECTION.UP;
      } else if (key === "ArrowDown" && direction !== DIRECTION.UP) {
        pendingDirection = DIRECTION.DOWN;
      } else if (key === "ArrowLeft" && direction !== DIRECTION.RIGHT) {
        pendingDirection = DIRECTION.LEFT;
      } else if (key === "ArrowRight" && direction !== DIRECTION.LEFT) {
        pendingDirection = DIRECTION.RIGHT;
      }
    }

    window.addEventListener(
      "keydown",
      (e) => {
        if (
          e.key === "ArrowUp" ||
          e.key === "ArrowDown" ||
          e.key === "ArrowLeft" ||
          e.key === "ArrowRight" ||
          e.key === " "
        ) {
          e.preventDefault();
          setDirectionFromKey(e.key);
        }
      },
      { passive: false }
    );

  // Touch controls (more sensitive)
const SWIPE_THRESHOLD = 4;      // base distance in px
const QUICK_SWIPE_TIME = 120;   // ms. Fast swipes can be a bit shorter.
const QUICK_SWIPE_MIN = 3;      // px for a very fast swipe

let touchStartX = null;
let touchStartY = null;
let touchStartTime = null;

canvas.addEventListener(
  "touchstart",
  (e) => {
    if (e.touches.length > 0) {
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      touchStartTime = performance.now();

      if (gameState === "start") {
        startGame();
      } else if (gameState === "dead") {
        restartAfterDeath();
      }
    }
    e.preventDefault();
  },
  { passive: false }
);

canvas.addEventListener(
  "touchmove",
  (e) => {
    if (
      e.touches.length > 0 &&
      touchStartX != null &&
      touchStartY != null
    ) {
      const t = e.touches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;

      const absX = Math.abs(dx);
      const absY = Math.abs(dy);

      const dt = performance.now() - (touchStartTime || 0);
      const fastSwipe =
        dt < QUICK_SWIPE_TIME &&
        (absX > QUICK_SWIPE_MIN || absY > QUICK_SWIPE_MIN);

      const threshold = fastSwipe ? QUICK_SWIPE_MIN : SWIPE_THRESHOLD;

      if (absX > absY) {
        // horizontal swipe
        if (dx > threshold && direction !== DIRECTION.LEFT) {
          pendingDirection = DIRECTION.RIGHT;
        } else if (dx < -threshold && direction !== DIRECTION.RIGHT) {
          pendingDirection = DIRECTION.LEFT;
        }
      } else {
        // vertical swipe
        if (dy > threshold && direction !== DIRECTION.UP) {
          pendingDirection = DIRECTION.DOWN;
        } else if (dy < -threshold && direction !== DIRECTION.DOWN) {
          pendingDirection = DIRECTION.UP;
        }
      }
    }
    e.preventDefault();
  },
  { passive: false }
);

canvas.addEventListener(
  "touchend",
  (e) => {
    touchStartX = null;
    touchStartY = null;
    touchStartTime = null;
    e.preventDefault();
  },
  { passive: false }
);


    // -----------------------------
    // Game loop
    // -----------------------------
    function startGame() {
      if (gameState === "playing") return;
      resetGame();
      gameState = "playing";
      document.body.classList.add("playing");

      if (!music.paused) {
        music.pause();
      }
      music.currentTime = 0;
      music.play().catch(() => {});

      lastTickTime = performance.now() + START_DELAY_MS;
      if (!tickId) {
        tickId = requestAnimationFrame(tick);
      }
    }

    function restartAfterDeath() {
      resetGame();
      gameState = "playing";
      document.body.classList.add("playing");

      if (!music.paused) {
        music.pause();
      }
      music.currentTime = 0;
      music.play().catch(() => {});

      lastTickTime = performance.now() + START_DELAY_MS;
    }

    function pauseGame() {
      gameState = "paused";
    }

    function resumeGame() {
      gameState = "playing";
      lastTickTime = performance.now();
    }

    function tick(timestamp) {
      if (!lastTickTime) {
        lastTickTime = timestamp;
      }

      const delta = timestamp - lastTickTime;
      if (delta >= TICK_MS) {
        update();
        lastTickTime = timestamp;
      }

      draw();
      tickId = requestAnimationFrame(tick);
    }

    function update() {
      if (gameState !== "playing") return;

      direction = pendingDirection;

      const head = snake[0];
      const newHead = {
        x: head.x + direction.x,
        y: head.y + direction.y
      };

      // Wall collision
      if (
        newHead.x < 0 ||
        newHead.x >= GRID_COLS ||
        newHead.y < 0 ||
        newHead.y >= GRID_ROWS
      ) {
        handleDeath();
        return;
      }

      // Self collision
      if (snake.some((seg) => seg.x === newHead.x && seg.y === newHead.y)) {
        handleDeath();
        return;
      }

      const willGrow = newHead.x === food.x && newHead.y === food.y;

      snake.unshift(newHead);

      if (willGrow) {
        score += 1;
        placeFood();
      } else {
        snake.pop();
      }
    }

    function handleDeath() {
      gameState = "dead";
      document.body.classList.remove("playing");

      music.pause();
      music.currentTime = 0;
      deathSound.currentTime = 0;
      deathSound.play().catch(() => {});
    }

    // -----------------------------
    // Drawing helpers
    // -----------------------------
    function clearCanvas() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    }

    function drawBackground() {
      ctx.drawImage(bgImage, 0, 0, GAME_WIDTH, GAME_HEIGHT);
    }

    function drawSnake() {
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#000000";

      // body (tail to just before head)
      for (let i = snake.length - 1; i > 0; i--) {
        const seg = snake[i];
        drawCell(seg.x, seg.y, false);
      }

      // head
      const head = snake[0];
      drawCell(head.x, head.y, true);
    }

    function drawCell(gridX, gridY, isHead) {
      const px = gridX * CELL_SIZE;
      const py = gridY * CELL_SIZE;

      ctx.fillStyle = "#7cf35b";
      ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);

      ctx.strokeStyle = "#000000";
      ctx.strokeRect(px, py, CELL_SIZE, CELL_SIZE);

      if (isHead) {
        drawHeadEyes(px, py);
      }
    }

    // Constant top-down eyes
    function drawHeadEyes(px, py) {
      const eyeSize = Math.floor(CELL_SIZE / 5);
      const offsetX = Math.floor(CELL_SIZE / 4);
      const offsetY = Math.floor(CELL_SIZE / 6);

      ctx.fillStyle = "#000000";

      // Left eye
      ctx.fillRect(px + offsetX, py + offsetY, eyeSize, eyeSize);

      // Right eye
      ctx.fillRect(
        px + CELL_SIZE - offsetX - eyeSize,
        py + offsetY,
        eyeSize,
        eyeSize
      );
    }

    function drawFood() {
      ctx.fillStyle = "#ff6b6b";
      const px = food.x * CELL_SIZE;
      const py = food.y * CELL_SIZE;
      ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 2;
      ctx.strokeRect(px, py, CELL_SIZE, CELL_SIZE);
    }

    function drawScore() {
      ctx.fillStyle = "#ffffff";
      ctx.font = "18px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
      ctx.textBaseline = "top";
      ctx.textAlign = "left";
      ctx.fillText("Score: " + score, 8, 14);
    }

    function drawStartOverlay() {
      if (logoImage.complete) {
        const logoWidth = GAME_WIDTH * 0.7;
        const ratio = logoImage.height / logoImage.width;
        const logoHeight = logoWidth * ratio;
        const logoX = (GAME_WIDTH - logoWidth) / 2;
        const logoY = Math.floor(GAME_HEIGHT * 0.18);
        ctx.drawImage(logoImage, logoX, logoY, logoWidth, logoHeight);
      }

      ctx.fillStyle = "#ffffff";
      ctx.font = "20px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillText(
        "Press Space or Arrow key to start",
        GAME_WIDTH / 2,
        GAME_HEIGHT * 0.65
      );
      ctx.fillText(
        "On mobile: swipe to move",
        GAME_WIDTH / 2,
        GAME_HEIGHT * 0.72
      );
    }

    function drawDeathOverlay() {
      if (deathImage.complete && deathImage.width && deathImage.height) {
        const imgRatio = deathImage.width / deathImage.height;
        const canvasRatio = GAME_WIDTH / GAME_HEIGHT;

        let drawWidth;
        let drawHeight;

        if (imgRatio > canvasRatio) {
          drawWidth = GAME_WIDTH;
          drawHeight = GAME_WIDTH / imgRatio;
        } else {
          drawHeight = GAME_HEIGHT;
          drawWidth = GAME_HEIGHT * imgRatio;
        }

        const drawX = (GAME_WIDTH - drawWidth) / 2;
        const drawY = (GAME_HEIGHT - drawHeight) / 2;

        ctx.drawImage(deathImage, drawX, drawY, drawWidth, drawHeight);
      }
      // Text is baked into the image
    }

    function drawPausedOverlay() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      ctx.fillStyle = "#ffffff";
      ctx.font = "18px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Paused", GAME_WIDTH / 2, GAME_HEIGHT * 0.5);
      ctx.font = "12px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
      ctx.fillText("Press Space to resume", GAME_WIDTH / 2, GAME_HEIGHT * 0.57);
    }

    function draw() {
      clearCanvas();
      drawBackground();
      drawFood();
      drawSnake();
      drawScore();

      if (gameState === "start") {
        drawStartOverlay();
      } else if (gameState === "dead") {
        drawDeathOverlay();
      } else if (gameState === "paused") {
        drawPausedOverlay();
      }
    }

    // -----------------------------
    // Newsletter interaction
    // -----------------------------
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("newsletter-form");
      if (!form) return;

      const emailInput = document.getElementById("newsletter-email");
      const submitButton = form.querySelector('button[type="submit"]');
      const successEl = document.getElementById("newsletter-success");
      const errorEl = document.getElementById("newsletter-error");

      const originalButtonText = submitButton.textContent;

      function showFeedback(target) {
        [successEl, errorEl].forEach((el) => {
          if (!el) return;
          if (el === target) {
            el.classList.add("visible");
          } else {
            el.classList.remove("visible");
          }
        });
      }

      form.addEventListener("submit", (e) => {
        const email = emailInput.value.trim();
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // Invalid email: stop, show error
        if (!emailPattern.test(email)) {
          e.preventDefault();
          showFeedback(errorEl);
          emailInput.focus();
          return;
        }

        // Valid email: let the form submit to Buttondown, but show UI state
        showFeedback(null);
        submitButton.disabled = true;
        submitButton.textContent = "Sending…";

        setTimeout(() => {
          submitButton.disabled = false;
          submitButton.textContent = originalButtonText;
          showFeedback(successEl);
        }, 1000);
      });

      // Hide error when user starts typing again
      emailInput.addEventListener("input", () => {
        if (errorEl) errorEl.classList.remove("visible");
      });
    });

    // -----------------------------
    // Kick off
    // -----------------------------
    resetGame();
    draw();

    canvas.addEventListener("click", () => {
      canvas.focus();
    });
  </script>
</body>
</html>
